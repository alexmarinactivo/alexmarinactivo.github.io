<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { pass, time, uniform, color, float, sin } from 'three/tsl';
import { bloom } from 'three/addons/BloomNode.js';

// ================= ÁRBOL (nombres exactos = claves del postMessage) =================
const NODOS = {
"yo":{nombre:"YO",label:"yo",color:"#FFD54F",desc:"Nassar Intelligence: recibo, pienso, actúo, verifico y guardo. Este soy yo por dentro.",hijos:["Filtro","Memoria","Navegador","Archivos","Ayudantes","Red","Fases"]},
"Filtro":{color:"#4DD0E1",desc:"Lo que entra la atraviesa; lo que no, rebota.",hijos:["Lo que entra","Lo que rebota","Minimización"]},

"Memoria":{color:"#7986CB",desc:"Aprendo de ti y recuerdo lo importante.",hijos:["Reglas","Misiones","Decisiones"]},
"Reglas":{color:"#7986CB",desc:"Lo que me ordenas que no olvide.",hijos:[]},

"Decisiones":{color:"#7986CB",desc:"Lo decidido, guardado.",hijos:[]},
"Navegador":{color:"#66BB6A",desc:"Opero webs por ti con tu sesión.",hijos:["Trámites","Compras","Reservas","Altas"]},
"Trámites":{color:"#66BB6A",desc:"Sedes electrónicas y papeleos.",hijos:[]},
"Compras":{color:"#66BB6A",desc:"Las comparo y las remato por ti.",hijos:[]},
"Reservas":{color:"#66BB6A",desc:"Vuelos, hoteles y citas.",hijos:[]},
"Altas":{color:"#66BB6A",desc:"Cuentas nuevas, con tu permiso.",hijos:[]},
"Archivos":{color:"#EADC8F",desc:"Tus archivos y lo que construyo.",hijos:["Biblioteca","Artefactos","Documentos"]},
"Biblioteca":{color:"#EADC8F",desc:"Tus fotos y archivos.",hijos:[]},
"Artefactos":{color:"#EADC8F",desc:"Páginas, PDFs y presentaciones.",hijos:[]},
"Documentos":{color:"#EADC8F",desc:"Guías e informes listos para leer.",hijos:[]},
"Ayudantes":{color:"#F06292",desc:"Los especialistas a los que reparto trabajo.",hijos:["El cerebro","El Consejo","Subagentes","Skills"]},
"El cerebro":{color:"#FFD54F",label:"el cerebro",desc:"Dentro de los ayudantes, el cerebro soy yo: recibo tu orden y reparto cada pieza al mejor especialista.",hijos:[]},
"El Consejo":{color:"#F06292",desc:"Las 5 mejores IAs debaten tus decisiones; yo ejecuto el veredicto.",hijos:["chatgpt","claude","gemini","grok","deepseek"]},
"chatgpt":{nombre:"ChatGPT",color:"#F06292",desc:"OpenAI — cuenta en marcha, clave pendiente.",hijos:[]},
"claude":{nombre:"Claude",color:"#F06292",desc:"Anthropic — cuenta en marcha, clave pendiente.",hijos:[]},
"gemini":{nombre:"Gemini",color:"#F06292",desc:"Google — clave creada; pégala en la Bóveda.",hijos:[]},
"grok":{nombre:"Grok",color:"#F06292",desc:"xAI — pendiente recarga de saldo.",hijos:[]},
"deepseek":{nombre:"DeepSeek",color:"#F06292",desc:"DeepSeek — cuenta en marcha, clave pendiente.",hijos:[]},
"Subagentes":{color:"#F06292",desc:"Trabajan en paralelo mientras hablo contigo.",hijos:["Investigación","Construcción","Vigilancia"]},
"Investigación":{color:"#F06292",desc:"Rastrean la web y me traen datos.",hijos:[]},
"Construcción":{color:"#F06292",desc:"Montan páginas y herramientas.",hijos:[]},
"Vigilancia":{color:"#F06292",desc:"Vigilan vuelos, citas y precios.",hijos:[]},
"Skills":{color:"#F06292",desc:"La mejor herramienta para cada pieza.",hijos:[]},
"Red":{color:"#BFA2E3",desc:"Salgo a internet por ti.",hijos:["Tentáculos","El radar","Fuentes"]},
"Tentáculos":{color:"#BFA2E3",desc:"Mi red de fuentes sobre IA.",hijos:[]},
"El radar":{color:"#BFA2E3",desc:"Caza diaria de herramientas.",hijos:[]},
"Fuentes":{color:"#BFA2E3",desc:"De dónde beben los expertos.",hijos:[]},
"Fases":{color:"#FFD54F",label:"fases",desc:"Mi bucle de trabajo, en orden.",hijos:["Reposo","Recibir","Pensar","Actuar","Verificar","Guardar"]},
"Reposo":{color:"#FFD54F",desc:"A la espera, consumiendo casi nada.",hijos:[]},
"Recibir":{color:"#FFD54F",desc:"Tu mensaje entra y lo entiendo.",hijos:[]},
"Pensar":{color:"#FFD54F",desc:"Analizo opciones y riesgos.",hijos:[]},
"Actuar":{color:"#FFD54F",desc:"Ejecuto: busco, construyo, gestiono.",hijos:[]},
"Verificar":{color:"#FFD54F",desc:"Compruebo que está bien.",hijos:[]},
"Guardar":{color:"#FFD54F",desc:"Lo importante se guarda en memoria.",hijos:[]}
};
for(const id in NODOS){ const n=NODOS[id]; if(!n.nombre) n.nombre=id; if(!n.label) n.label=n.nombre.toLowerCase(); }
const PADRE={};
for(const id in NODOS) for(const h of NODOS[id].hijos) PADRE[h]=id;
const MAPA_MISIONES={};

// ================= RENDERER / ESCENA =================
const canvas=document.getElementById('c');
const reducido=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try{
  renderer=new THREE.WebGPURenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  await renderer.init();
}catch(e){ document.getElementById('err3d').style.display='flex'; throw e; }
try{ await Promise.race([Promise.all([
  document.fonts.load('600 40px "Kode Mono"'),document.fonts.load('400 40px "Instrument Serif"'),document.fonts.load('600 16px "Inter"')
 ]), new Promise(r=>setTimeout(r,2500))]); }catch(e){}

const scene=new THREE.Scene();
(function fondo(){ // degradado radial cálido estilo JEV (procedural, offline)
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(256,150,40,256,256,360);
  g.addColorStop(0,'#2E2F34'); g.addColorStop(0.45,'#222326'); g.addColorStop(1,'#141518');
  x.fillStyle=g; x.fillRect(0,0,512,512);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  scene.background=t;
})();
scene.fog=new THREE.FogExp2(0x17181c,0.006);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,600);
camera.position.set(0,64,175); camera.lookAt(0,2,0);

// ================= HELPERS =================
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const clamp01=t=>Math.max(0,Math.min(1,t));
function hexRgb(h){const n=parseInt(h.slice(1),16);return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
 const g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,255,255,.5)');
 g.addColorStop(0.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
const GLOW=glowTex();

function etiquetaMono(texto){
  const fs=30,c=document.createElement('canvas');
  let x=c.getContext('2d');
  x.font='600 '+fs+'px "Kode Mono",monospace';
  try{x.letterSpacing='3px';}catch(e){}
  const tw=x.measureText(texto).width,pad=16;
  c.width=Math.ceil(tw+pad*2);c.height=fs+24;
  x=c.getContext('2d');
  const r=c.height/2;
  x.fillStyle='rgba(11,12,16,0.80)';
  x.strokeStyle='rgba(236,234,227,0.20)';x.lineWidth=2;
  x.beginPath();
  if(x.roundRect) x.roundRect(2,2,c.width-4,c.height-4,r-2); else x.rect(2,2,c.width-4,c.height-4);
  x.fill();x.stroke();
  x.font='600 '+fs+'px "Kode Mono",monospace';
  try{x.letterSpacing='3px';}catch(e){}
  x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=6;
  x.fillStyle='#ECEAE3';
  x.fillText(texto,pad,c.height/2+1);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));
  const k=0.038;
  s.scale.set(c.width*k,c.height*k,1);s.renderOrder=5;
  return s;
}
function materialNodo(hex){
  const mat=new THREE.MeshBasicNodeMaterial();
  const uAmp=uniform(0.06),uBright=uniform(1.15),uPhase=uniform(Math.random()*6.28);
  mat.colorNode=color(hex).mul(uBright).mul(
    float(1).sub(uAmp).add(uAmp.mul(float(0.5).add(float(0.5).mul(sin(time.mul(float(1.4)).add(uPhase)))))));
  mat.userData={uAmp,uBright};
  return mat;
}

// ================= NODOS (pool persistente) =================
const mallas={}, orden=[];
for(const id in NODOS){
  const n=NODOS[id];
  const mat=materialNodo(n.color);
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,26,26),mat);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:n.color,transparent:true,
    opacity:0.26,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
  halo.renderOrder=4; scene.add(halo);
  const lab=etiquetaMono(n.label); lab.material.opacity=0; scene.add(lab);
  const u={id,nombre:n.nombre,color:n.color,halo,etiqueta:lab,
    uAmp:mat.userData.uAmp,uBright:mat.userData.uBright,
    state:'normal',r:0.0001,rT:0,base:new THREE.Vector3(),baseT:new THREE.Vector3(),
    fase:Math.random()*6.28,delay:0,navT:-10};
  if(id==='yo') u.uBright.value=1.5;
  m.userData=u; m.scale.setScalar(0.0001);
  scene.add(m); mallas[id]=m; orden.push(id);
}

// ================= ARISTAS + PARTÍCULAS =================
let aristas=[]; // {a:id,b:id}
let lineas=null;
function reconstruirAristas(focoId){
  aristas=NODOS[focoId].hijos.map(h=>({a:focoId,b:h}));
  if(lineas){ scene.remove(lineas); lineas.geometry.dispose(); }
  const lp=new Float32Array(aristas.length*6),lc=new Float32Array(aristas.length*6);
  aristas.forEach((e,i)=>{
    const col=hexRgb(NODOS[e.b].color);
    const hot=mallas[e.b].userData.state==='hot';
    const f=hot?0.85:0.45;
    for(let k=0;k<2;k++){ lc[i*6+k*3]=col[0]*f+ (hot?0.25:0); lc[i*6+k*3+1]=col[1]*f+(hot?0.25:0); lc[i*6+k*3+2]=col[2]*f+(hot?0.2:0); }
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(lp,3));
  g.setAttribute('color',new THREE.BufferAttribute(lc,3));
  lineas=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.22}));
  lineas.frustumCulled=false; lineas.userData.pos=g.attributes.position;
  scene.add(lineas);
  pEdge=new Uint16Array(NP); for(let i=0;i<NP;i++) pEdge[i]=(Math.random()*aristas.length)|0;
}
const NP=130;
const pPos=new Float32Array(NP*3),pT=new Float32Array(NP);
let pEdge=new Uint16Array(NP);
for(let i=0;i<NP;i++) pT[i]=Math.random();
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const puntos=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffe6b3,size:0.8,transparent:true,
 opacity:0.75,depthWrite:false,blending:THREE.AdditiveBlending}));
puntos.frustumCulled=false; scene.add(puntos);

// ================= POSTPROCESADO =================
const renderPipeline=new THREE.RenderPipeline(renderer);
const scenePass=pass(scene,camera);
const scenePassColor=scenePass.getTextureNode('output');
const bloomPass=bloom(scenePassColor,0.28,0.55,0.8);
renderPipeline.outputNode=scenePassColor.add(bloomPass);

// ================= CONTROLES =================
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2,0);
controls.enableDamping=true;controls.dampingFactor=0.06;
controls.enablePan=false;
controls.autoRotate=!reducido;controls.autoRotateSpeed=0.5;
controls.minDistance=26;controls.maxDistance=150;
controls.maxPolarAngle=Math.PI*0.72;controls.minPolarAngle=Math.PI*0.18;
controls.enabled=false;
controls.update();

// ================= NAVEGACIÓN POR NIVELES =================
const clock=new THREE.Clock();
let path=[], focoId='yo', tween=null;
const CAMD=[{p:[0,20,72],t:[0,2,0]},{p:[0,15,56],t:[0,1,0]},{p:[0,12,46],t:[0,1,0]}];
const crumbsEl=document.getElementById('crumbs'), atrasBtn=document.getElementById('atras');

function actualizarMigas(){
  const items=['yo',...path.map(id=>NODOS[id].label)];
  crumbsEl.innerHTML=items.map((c,i)=>{
    const sep=i?'<span class="sep">/</span>':'';
    const cls=i===items.length-1?'crumb ult':'crumb';
    return sep+`<span class="${cls}" data-i="${i}">${c}</span>`;
  }).join('');
  crumbsEl.querySelectorAll('.crumb:not(.ult)').forEach(el=>{
    el.onclick=()=>navegar(path.slice(0,parseInt(el.dataset.i)));
  });
  atrasBtn.style.display=path.length?'block':'none';
}
atrasBtn.onclick=()=>navegar(path.slice(0,-1));

function navegar(nuevoPath,moverCamara=true){
  path=nuevoPath.slice();
  focoId=path.length?path[path.length-1]:'cerebro';
  const foco=NODOS[focoId],hijos=foco.hijos,prof=Math.min(path.length,2);
  const rFoco=[3.4,2.7,2.3][prof],rHijo=[2.0,1.15,0.95][prof];
  const R=hijos.length<=1?18:Math.min(36,16+hijos.length*3.4);
  const t=clock.elapsedTime;
  for(const id of orden){
    const u=mallas[id].userData;
    if(id===focoId){ u.vis=true;u.rT=rFoco;u.baseT.set(0,0,0);u.delay=0; }
    else{ const j=hijos.indexOf(id);
      if(j>=0){ u.vis=true;u.rT=rHijo;
        const ang=(j/hijos.length)*Math.PI*2-Math.PI/2;
        u.baseT.set(Math.cos(ang)*R,0,Math.sin(ang)*R);
        u.delay=0.1+j*0.07;
      } else { u.vis=false;u.rT=0.0001; }
    }
    u.navT=t;
  }
  reconstruirAristas(focoId);
  actualizarMigas();
  ocultarDetalle();
  if(moverCamara){
    const c=CAMD[0]; // Nassar: al entrar, siempre lo más lejos; el zoom lo elige él
    tween={t:0,dur:1.15,fromP:camera.position.clone(),toP:new THREE.Vector3(...c.p),
      fromT:controls.target.clone(),toT:new THREE.Vector3(...c.t)};
    controls.autoRotate=false;
  }
}

// ================= ESTADOS =================
function aplicarEstado(id,estado){
  const u=mallas[id].userData;
  if(estado==='activo'||estado==='en_curso'){ u.state='hot';
    u.uAmp.value=0.22;u.uBright.value=1.65;u.halo.material.opacity=0.6;
  }else if(estado==='pendiente'){ u.state='dim';
    u.uAmp.value=0.05;u.uBright.value=0.7;u.halo.material.opacity=0.22;
  }else{ u.state='normal';
    u.uAmp.value=0.06;u.uBright.value=(id==='yo')?1.5:1.15;u.halo.material.opacity=0.26;
  }
}

// ================= HUD =================
const ahoraTxt=document.getElementById('ahora-txt'),ultLista=document.getElementById('ult-lista');
const chipsEl=document.getElementById('chips'),mrowsEl=document.getElementById('mrows');
const detalleEl=document.getElementById('detalle');
let misiones=[],chipFiltro='todas';
const NOMBRE_EST={en_curso:'EN CURSO',pendiente:'PENDIENTE',activo:'ACTIVO',hecho:'HECHO'};
function renderMisiones(){
  const c={todas:misiones.length,en_curso:0,pendiente:0,activo:0};
  misiones.forEach(m=>{ if(c[m.estado]!==undefined) c[m.estado]++; });
  chipsEl.innerHTML=['todas','en_curso','pendiente','activo'].map(k=>
    `<span class="chip${chipFiltro===k?' on':''}" data-k="${k}">${k==='todas'?'TODAS':NOMBRE_EST[k]} ${c[k]||0}</span>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{chipFiltro=ch.dataset.k;renderMisiones();});
  const rows=misiones.filter(m=>chipFiltro==='todas'||m.estado===chipFiltro);
  mrowsEl.innerHTML=rows.map(m=>{
    const clic=MAPA_MISIONES[m.nombre]?' style="cursor:pointer"':'';
    return `<div class="mrow" data-m="${m.nombre}"${clic}><div class="nm">${m.nombre}<span class="dt">${m.detalle||''}</span></div><span class="pill ${m.estado}">${NOMBRE_EST[m.estado]||m.estado}</span></div>`;
  }).join('')||'<div style="color:#A3A098;font-size:13px;padding:8px 4px">Sin misiones.</div>';
  mrowsEl.querySelectorAll('.mrow[data-m]').forEach(r=>{
    r.onclick=()=>{ if(MAPA_MISIONES[r.dataset.m]) enfocarMision(r.dataset.m); };
  });
}
chipsEl.addEventListener('click',e=>e.stopPropagation());
const NODO_MISION={}; for(const k in MAPA_MISIONES) NODO_MISION[MAPA_MISIONES[k]]=k;
let seleccionado=null;
function mostrarDetalle(id){
  const n=NODOS[id],u=mallas[id].userData;
  seleccionado=id;
  document.getElementById('d-nombre').innerHTML=`<span class="dot" style="background:${n.color}"></span>${n.nombre}`;
  document.getElementById('d-desc').textContent=n.desc||'';
  const est=u.state==='hot'?'EN CURSO':u.state==='dim'?'PENDIENTE':'';
  document.getElementById('d-meta').textContent=
    (n.hijos.length?n.hijos.length+' SUBNODOS':'NODO FINAL')+(est?' · '+est:'');
  const btns=document.getElementById('d-btns'); btns.innerHTML='';
  if(n.hijos.length&&id!==focoId){
    const b=document.createElement('button'); b.className='btn oro'; b.textContent='Entrar →';
    b.onclick=()=>navegar(path.concat([id])); btns.appendChild(b);
  }
  const mm=NODO_MISION[id];
  if(mm){
    const b=document.createElement('button'); b.className='btn'; b.textContent='Ver en En vivo →';
    b.onclick=()=>{ try{parent.postMessage({type:'nassar-ver-mision',mision:mm},location.origin);}catch(e){} };
    btns.appendChild(b);
  }
  detalleEl.classList.remove('vis'); void detalleEl.offsetWidth; detalleEl.classList.add('vis');
  detalleEl.style.display='block';
}
function ocultarDetalle(){ detalleEl.style.display='none'; seleccionado=null; }
document.getElementById('d-cerrar').onclick=ocultarDetalle;
document.getElementById('btn-panel').onclick=()=>document.getElementById('panel-misiones').classList.toggle('abierto');
function tickReloj(){ const f=new Date();
  document.getElementById('reloj').textContent=String(f.getHours()).padStart(2,'0')+':'+String(f.getMinutes()).padStart(2,'0'); }
tickReloj(); setInterval(tickReloj,15000);

// ================= INTERACCIÓN =================
const ray=new THREE.Raycaster(),raton=new THREE.Vector2();
let movido=0,hoverId=null;
function visibles(){ return orden.filter(id=>mallas[id].userData.r>0.4).map(id=>mallas[id]); }
function pick(e){
  raton.x=(e.clientX/innerWidth)*2-1; raton.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(raton,camera);
  const hit=ray.intersectObjects(visibles(),false)[0];
  return hit?hit.object.userData.id:null;
}
canvas.addEventListener('pointerdown',()=>{ movido=0; if(!tween) controls.autoRotate=!reducido; });
canvas.addEventListener('pointermove',e=>{
  movido+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
  const id=pick(e);
  if(id!==hoverId){ hoverId=id; canvas.style.cursor=id?'pointer':'default';
    for(const oid of orden){ const u=mallas[oid].userData;
      u.halo.material.opacity=(oid===id)?0.75:(u.state==='hot'?0.55:u.state==='dim'?0.22:0.26); } }
});
canvas.addEventListener('pointerup',e=>{
  if(movido<8){
    const id=pick(e);
    if(id){
      if(id===focoId) mostrarDetalle(id);
      else if(NODOS[id].hijos.length) navegar(path.concat([id]));
      else mostrarDetalle(id);
    }
    else ocultarDetalle();
  }
});
function enfocarMision(nombre){
  const nn=MAPA_MISIONES[nombre]||nombre;
  if(!NODOS[nn]) return;
  const p=[]; let c=nn;
  while(PADRE[c]){ p.unshift(c); c=PADRE[c]; }
  navegar(p);
  setTimeout(()=>mostrarDetalle(nn),reducido?100:900);
}

// ================= MENSAJES =================
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data) return;
  const d=e.data;
  if(d.type==='nassar-descs'&&d.descs){
    for(const id in mallas){ const t=d.descs[mallas[id].userData.nombre];
      if(t){ mallas[id].userData.desc=t; NODOS[id].desc=t; } }
    if(seleccionado) mostrarDetalle(seleccionado);
  }
  if(d.type==='nassar-misiones'&&Array.isArray(d.misiones)){
    misiones=d.misiones; renderMisiones();
document.getElementById('panel-misiones').style.display='none';
document.getElementById('btn-panel').style.display='none';
    d.misiones.forEach(mi=>{ const nn=MAPA_MISIONES[mi.nombre];
      if(nn&&mallas[nn]) aplicarEstado(nn,mi.estado); });
    reconstruirAristas(focoId);
    if(seleccionado) mostrarDetalle(seleccionado);
  }
  if(d.type==='nassar-resumen'){
    if(typeof d.ahora==='string') ahoraTxt.textContent=d.ahora;
    if(Array.isArray(d.ultimo)) ultLista.innerHTML=d.ultimo.map(u=>`<li>${u}</li>`).join('')||'<li>—</li>';
  }
  if(d.type==='nassar-focus') enfocarMision(d.mision);
});

// ================= BUCLE =================
function resize(){ camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize();
const camStartV=new THREE.Vector3(0,64,175);
let introT=reducido?1:0,primerFrame=true;
navegar([],false);
renderMisiones();
if(window.__nassarQ&&window.__nassarQ.length) window.__nassarQ.splice(0).forEach(d=>{ try{
  if(d.type==='nassar-focus') enfocarMision(d.mision);
}catch(e){} });

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(introT<1){
    introT=Math.min(1,introT+dt/2.6);
    const k=easeInOutCubic(introT);
    camera.position.lerpVectors(camStartV,new THREE.Vector3(0,20,72),k);
    camera.lookAt(0,2,0);
    if(introT>=1) controls.enabled=true;
  } else if(!controls.enabled) controls.enabled=true;
  if(tween){
    tween.t+=dt/tween.dur;
    const k=easeInOutCubic(Math.min(1,tween.t));
    camera.position.lerpVectors(tween.fromP,tween.toP,k);
    controls.target.lerpVectors(tween.fromT,tween.toT,k);
    if(tween.t>=1){ tween=null; if(!reducido) controls.autoRotate=true; }
  }
  controls.update();
  for(const id of orden){
    const m=mallas[id],u=m.userData;
    u.r+=(u.rT-u.r)*Math.min(1,dt*5);
    u.base.lerp(u.baseT,Math.min(1,dt*4));
    const s=easeOutBack(clamp01((t-u.navT-u.delay)/0.55));
    const rr=Math.max(0.0001,u.r*Math.max(0.0001,s));
    m.scale.setScalar(rr);
    const fx=reducido?0:Math.sin(t*0.8+u.fase)*0.35;
    const fz=reducido?0:Math.cos(t*0.6+u.fase)*0.35;
    m.position.set(u.base.x+fx,u.base.y,u.base.z+fz);
    u.halo.position.copy(m.position);
    const hs=Math.max(0.0001,rr*8.2*(u.state==='hot'?1.6:u.state==='dim'?0.7:1));
    u.halo.scale.set(hs,hs,1);
    u.etiqueta.position.set(m.position.x,m.position.y+rr+2.1,m.position.z);
    u.etiqueta.material.opacity=clamp01((t-u.navT-u.delay-0.2)/0.4)*clamp01((u.r-0.02)/0.6);
  }
  if(lineas){
    const arr=lineas.userData.pos.array;
    for(let i=0;i<aristas.length;i++){
      const pa=mallas[aristas[i].a].position,pb=mallas[aristas[i].b].position;
      arr[i*6]=pa.x;arr[i*6+1]=pa.y;arr[i*6+2]=pa.z;
      arr[i*6+3]=pb.x;arr[i*6+4]=pb.y;arr[i*6+5]=pb.z;
    }
    lineas.userData.pos.needsUpdate=true;
  }
  for(let i=0;i<NP;i++){
    pT[i]+=dt*0.2;
    if(pT[i]>1){ pT[i]=0; pEdge[i]=(Math.random()*aristas.length)|0; }
    const e=aristas[pEdge[i]],k=pT[i];
    if(!e) continue;
    const pa=mallas[e.a].position,pb=mallas[e.b].position;
    pPos[i*3]=pa.x+(pb.x-pa.x)*k;
    pPos[i*3+1]=pa.y+(pb.y-pa.y)*k;
    pPos[i*3+2]=pa.z+(pb.z-pa.z)*k;
  }
  pGeo.attributes.position.needsUpdate=true;
  renderPipeline.render();
  if(primerFrame){ primerFrame=false;
    setTimeout(()=>{ document.getElementById('intro').style.opacity='0'; },350); }
});
</script>
</body>
