<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== errores visibles con reintento ===== */
const errEl=document.getElementById('err3d');
let __ok=false;
function fallo(){
  if(__ok) return; __ok='f';
  errEl.style.display='flex';
  errEl.innerHTML='<div>El 3D no arrancó aquí.<br><br><button id="btn-re" style="padding:12px 28px;border-radius:999px;border:0;background:#FFD54F;color:#111;font-weight:700;font-size:15px">Reintentar</button></div>';
  document.getElementById('btn-re').onclick=()=>location.reload();
}
addEventListener('error',()=>fallo());
addEventListener('unhandledrejection',()=>fallo());

/* ===== datos ===== */
const NODOS = {
"yo":{nombre:"YO",label:"yo",color:"#FFD54F",desc:"Nassar Intelligence: recibo, pienso, actúo, verifico y guardo. Este soy yo por dentro.",hijos:["Filtro","Memoria","Navegador","Archivos","Ayudantes","Red","Fases"]},
"Filtro":{color:"#4DD0E1",desc:"Lo que entra la atraviesa; lo que no, rebota.",hijos:["Lo que entra","Lo que rebota","Minimización"]},
"Lo que entra":{color:"#4DD0E1",desc:"Tus órdenes y los datos necesarios.",hijos:[]},
"Lo que rebota":{color:"#4DD0E1",desc:"Lo sensible o innecesario: bloqueado.",hijos:[]},
"Minimización":{color:"#4DD0E1",desc:"Si el dato no hace falta, no se suelta.",hijos:[]},
"Memoria":{color:"#7986CB",desc:"Aprendo de ti y recuerdo lo importante.",hijos:["Reglas","Misiones","Decisiones"]},
"Reglas":{color:"#7986CB",desc:"Lo que me ordenas que no olvide.",hijos:[]},
"Misiones":{color:"#7986CB",desc:"Tus objetivos, siempre a mano.",hijos:[]},
"Decisiones":{color:"#7986CB",desc:"Lo decidido, guardado.",hijos:[]},
"Navegador":{color:"#66BB6A",desc:"Opero webs por ti con tu sesión.",hijos:["Trámites","Compras","Reservas","Altas"]},
"Trámites":{color:"#66BB6A",desc:"Sedes electrónicas y papeleos.",hijos:[]},
"Compras":{color:"#66BB6A",desc:"Las comparo y las remato por ti.",hijos:[]},
"Reservas":{color:"#66BB6A",desc:"Vuelos, hoteles y citas.",hijos:[]},
"Altas":{color:"#66BB6A",desc:"Cuentas nuevas, con tu permiso.",hijos:[]},
"Archivos":{color:"#EADC8F",desc:"Tus archivos y lo que construyo.",hijos:["Biblioteca","Artefactos","Documentos"]},
"Biblioteca":{color:"#EADC8F",desc:"Tus fotos y archivos.",hijos:[]},
"Artefactos":{color:"#EADC8F",desc:"Páginas, PDFs y presentaciones.",hijos:[]},
"Documentos":{color:"#EADC8F",desc:"Guías e informes listos para leer.",hijos:[]},
"Ayudantes":{color:"#F06292",desc:"Los especialistas a los que reparto trabajo.",hijos:["El cerebro","El Consejo","Subagentes","Skills"]},
"El cerebro":{color:"#FFD54F",label:"el cerebro",desc:"Dentro de los ayudantes, el cerebro soy yo: recibo tu orden y reparto cada pieza al mejor especialista.",hijos:[]},
"El Consejo":{color:"#F06292",desc:"Las 5 mejores IAs debaten tus decisiones; yo ejecuto el veredicto.",hijos:["chatgpt","claude","gemini","grok","deepseek"]},
"chatgpt":{nombre:"ChatGPT",color:"#F06292",desc:"OpenAI — cuenta en marcha, clave pendiente.",hijos:[]},
"claude":{nombre:"Claude",color:"#F06292",desc:"Anthropic — cuenta en marcha, clave pendiente.",hijos:[]},
"gemini":{nombre:"Gemini",color:"#F06292",desc:"Google — clave creada; pégala en la Bóveda.",hijos:[]},
"grok":{nombre:"Grok",color:"#F06292",desc:"xAI — pendiente recarga de saldo.",hijos:[]},
"deepseek":{nombre:"DeepSeek",color:"#F06292",desc:"DeepSeek — cuenta en marcha, clave pendiente.",hijos:[]},
"Subagentes":{color:"#F06292",desc:"Trabajan en paralelo mientras hablo contigo.",hijos:["Investigación","Construcción","Vigilancia"]},
"Investigación":{color:"#F06292",desc:"Rastrean la web y me traen datos.",hijos:[]},
"Construcción":{color:"#F06292",desc:"Montan páginas y herramientas.",hijos:[]},
"Vigilancia":{color:"#F06292",desc:"Vigilan vuelos, citas y precios.",hijos:[]},
"Skills":{color:"#F06292",desc:"La mejor herramienta para cada pieza.",hijos:[]},
"Red":{color:"#BFA2E3",desc:"Salgo a internet por ti.",hijos:["Tentáculos","El radar","Fuentes"]},
"Tentáculos":{color:"#BFA2E3",desc:"Mi red de fuentes sobre IA.",hijos:[]},
"El radar":{color:"#BFA2E3",desc:"Caza diaria de herramientas.",hijos:[]},
"Fuentes":{color:"#BFA2E3",desc:"De dónde beben los expertos.",hijos:[]},
"Fases":{color:"#FFD54F",label:"fases",desc:"Mi bucle de trabajo, en orden.",hijos:["Reposo","Recibir","Pensar","Actuar","Verificar","Guardar"]},
"Reposo":{color:"#FFD54F",desc:"A la espera, consumiendo casi nada.",hijos:[]},
"Recibir":{color:"#FFD54F",desc:"Tu mensaje entra y lo entiendo.",hijos:[]},
"Pensar":{color:"#FFD54F",desc:"Analizo opciones y riesgos.",hijos:[]},
"Actuar":{color:"#FFD54F",desc:"Ejecuto: busco, construyo, gestiono.",hijos:[]},
"Verificar":{color:"#FFD54F",desc:"Compruebo que está bien.",hijos:[]},
"Guardar":{color:"#FFD54F",desc:"Lo importante se guarda en memoria.",hijos:[]}
};
for(const id in NODOS){ const n=NODOS[id]; if(!n.nombre) n.nombre=id; if(!n.label) n.label=n.nombre.toLowerCase(); }

/* ===== renderer WebGL2 clásico (síncrono, sin negociación de GPU) ===== */
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
  if(!renderer.getContext()) throw new Error('sin-contexto-webgl');
}catch(e){ fallo(); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;

/* ===== escena ===== */
const scene=new THREE.Scene();
(function fondo(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(256,150,40,256,256,360);
  g.addColorStop(0,'#2E2F34'); g.addColorStop(0.45,'#222326'); g.addColorStop(1,'#141518');
  x.fillStyle=g; x.fillRect(0,0,512,512);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  scene.background=t;
})();
scene.fog=new THREE.FogExp2(0x17181c,0.006);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,1500);
camera.position.set(0,90,195); camera.lookAt(0,0,0);

/* ===== utilidades ===== */
const clamp01=t=>Math.max(0,Math.min(1,t));
const easeOutBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,255,255,.5)');
  g.addColorStop(0.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
const GLOW=glowTex();
function etiqueta(texto,fs){
  const c=document.createElement('canvas');
  let x=c.getContext('2d');
  x.font='600 '+fs+'px "Kode Mono",monospace';
  try{x.letterSpacing='2px';}catch(e){}
  const tw=x.measureText(texto).width,pad=13;
  c.width=Math.ceil(tw+pad*2);c.height=fs+20;
  x=c.getContext('2d');
  x.fillStyle='rgba(11,12,16,0.78)';
  x.strokeStyle='rgba(236,234,227,0.16)';x.lineWidth=2;
  x.beginPath();
  const r=c.height/2;
  if(x.roundRect) x.roundRect(2,2,c.width-4,c.height-4,r-2); else x.rect(2,2,c.width-4,c.height-4);
  x.fill();x.stroke();
  x.font='600 '+fs+'px "Kode Mono",monospace';
  try{x.letterSpacing='2px';}catch(e){}
  x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=5;
  x.fillStyle='#ECEAE3';
  x.fillText(texto,pad,c.height/2+1);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));
  const k=0.035;
  s.scale.set(c.width*k,c.height*k,1);s.renderOrder=5;
  return s;
}
function nodo3d(hex,radio,esCentro){
  const base=new THREE.Color(hex);
  const mat=new THREE.MeshBasicMaterial({color:base.clone().multiplyScalar(esCentro?1.0:0.92)});
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,20),mat);
  m.scale.setScalar(radio);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:hex,transparent:true,
    opacity:0.24,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
  const hs=radio*(esCentro?9:8);
  halo.scale.set(hs,hs,1); halo.renderOrder=4;
  return {m,mat,halo,base,hs};
}

/* ================= MOTOR: mapa explorable ================= */
const PADRE={};
for(const id in NODOS) for(const h of NODOS[id].hijos) PADRE[h]=id;
const CENTRO='yo';
const CAMD=[[0,90,195],[0,52,118],[0,30,70]];

const mallas={}, orden=Object.keys(NODOS);
for(const id of orden){
  const n=NODOS[id], esC=id===CENTRO, r=esC?3.4:2.0;
  const nd=nodo3d(n.color,r,esC);
  const m=nd.m;
  m.position.set(0,-80,0); m.visible=false;
  const lab=etiqueta(n.label,esC?34:26);
  lab.position.set(0,-80,0); lab.material.opacity=0; lab.visible=false;
  nd.halo.position.set(0,-80,0); nd.halo.visible=false;
  scene.add(lab); scene.add(nd.halo);
  const u={id,nombre:n.nombre,mat:nd.mat,base:nd.base,halo:nd.halo,etiqueta:lab,r,
    fase:Math.random()*6.28,dim:0.92,hop:0.22,vis:false,dest:new THREE.Vector3(0,-80,0)};
  m.userData=u; scene.add(m); mallas[id]=m;
}

let path=[], focoId=CENTRO, hijos=[], tween=null, visSet=new Set();
const ray=new THREE.Raycaster(), raton=new THREE.Vector2();
const detalleEl=document.getElementById('detalle');
const migasEl=document.getElementById('migas');
const atrasBtn=document.getElementById('atras');
function hijosDe(id){ return (NODOS[id].hijos||[]).filter(h=>NODOS[h]); }

/* ---- aristas ---- */
let lineas=null, lineGeo=null, linePos=null, aristas=[];
function reconstruirAristas(){
  aristas=[];
  for(const id of orden){
    if(!visSet.has(id)||id===focoId) continue;
    const p=PADRE[id];
    if(p&&visSet.has(p)) aristas.push([p,id]);
  }
  if(lineas){ scene.remove(lineas); lineGeo.dispose(); lineas.material.dispose(); }
  linePos=new Float32Array(Math.max(aristas.length,1)*6);
  const lc=new Float32Array(Math.max(aristas.length,1)*6);
  aristas.forEach((e,i)=>{
    const c=hexRgb(NODOS[e[1]].color);
    for(let k=0;k<2;k++){ lc[i*6+k*3]=c[0]*0.45; lc[i*6+k*3+1]=c[1]*0.45; lc[i*6+k*3+2]=c[2]*0.45; }
  });
  lineGeo=new THREE.BufferGeometry();
  lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
  lineGeo.setAttribute('color',new THREE.BufferAttribute(lc,3));
  lineas=new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.28}));
  lineas.frustumCulled=false; lineas.visible=aristas.length>0;
  scene.add(lineas);
}
function actualizarAristas(){
  if(!lineas||!aristas.length) return;
  aristas.forEach((e,i)=>{
    const a=mallas[e[0]].position, b=mallas[e[1]].position;
    linePos[i*6]=a.x; linePos[i*6+1]=a.y; linePos[i*6+2]=a.z;
    linePos[i*6+3]=b.x; linePos[i*6+4]=b.y; linePos[i*6+5]=b.z;
  });
  lineGeo.attributes.position.needsUpdate=true;
}
/* ---- partículas doradas ---- */
const NP=70;
const pPos=new Float32Array(NP*3), pT=new Float32Array(NP), pEdge=new Uint16Array(NP);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const puntos=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffe6b3,size:0.85,transparent:true,
  opacity:0.7,depthWrite:false,blending:THREE.AdditiveBlending}));
puntos.frustumCulled=false; scene.add(puntos);
function resetParticulas(){
  for(let i=0;i<NP;i++){ pEdge[i]=aristas.length?(Math.random()*aristas.length)|0:0; pT[i]=Math.random(); }
}
function actualizarParticulas(dt){
  for(let i=0;i<NP;i++){
    pT[i]+=dt*0.22;
    if(pT[i]>1){ pT[i]=0; if(aristas.length) pEdge[i]=(Math.random()*aristas.length)|0; }
    const e=aristas[pEdge[i]], k=pT[i];
    if(!e){ pPos[i*3+1]=-80; continue; }
    const pa=mallas[e[0]].position, pb=mallas[e[1]].position;
    pPos[i*3]=pa.x+(pb.x-pa.x)*k; pPos[i*3+1]=pa.y+(pb.y-pa.y)*k; pPos[i*3+2]=pa.z+(pb.z-pa.z)*k;
  }
  pGeo.attributes.position.needsUpdate=true;
}

/* ---- navegación ---- */
function aplicarEstado(){
  for(const id of orden){
    const u=mallas[id].userData;
    const esFoco=id===focoId, esHijo=hijos.indexOf(id)>=0;
    let dim,hop;
    if(esFoco){ dim=1.0; hop=0.30; }
    else if(esHijo){ dim=1.0; hop=0.24; }
    else if(visSet.has(id)){ dim=0.85; hop=0.18; }
    else { dim=0.5; hop=0.08; }
    u.dim=dim; u.hop=hop;
    u.mat.color.copy(u.base).multiplyScalar(dim);
  }
}
function renderMigas(){
  const items=[CENTRO].concat(path);
  migasEl.innerHTML=items.map(id=>'<span class="miga">'+NODOS[id].label+'</span>').join('');
  atrasBtn.style.display=path.length?'flex':'none';
}
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false;
controls.minDistance=30; controls.maxDistance=420;
controls.maxPolarAngle=Math.PI*0.72; controls.minPolarAngle=Math.PI*0.18;
let camTween=null;
function moverCamara(d){
  const to=new THREE.Vector3(d[0],d[1],d[2]);
  const from=camera.position.clone(), t0=performance.now(), DUR=1100;
  if(camTween) cancelAnimationFrame(camTween);
  const step=(t)=>{
    const k=easeInOutCubic(clamp01((t-t0)/DUR));
    camera.position.lerpVectors(from,to,k);
    camera.lookAt(0,0,0);
    if(k<1) camTween=requestAnimationFrame(step); else camTween=null;
  };
  camTween=requestAnimationFrame(step);
}
function navegar(nuevoPath,animar=true){
  path=nuevoPath.slice();
  focoId=path.length?path[path.length-1]:CENTRO;
  hijos=hijosDe(focoId);
  visSet=new Set([focoId].concat(hijos));
  const nietos=[];
  for(const h of hijos) for(const n2 of hijosDe(h)) if(!visSet.has(n2)){ visSet.add(n2); nietos.push(n2); }
  let padreId=null;
  if(path.length){ padreId=path.length>1?path[path.length-2]:CENTRO; if(padreId!==focoId) visSet.add(padreId); }
  const R=hijos.length<=1?18:Math.min(36,16+hijos.length*3.4);
  const dest={};
  dest[focoId]=new THREE.Vector3(0,0,0);
  hijos.forEach((h,i)=>{ const a=(i/hijos.length)*Math.PI*2-Math.PI/2;
    dest[h]=new THREE.Vector3(Math.cos(a)*R,0,Math.sin(a)*R); });
  const porPadre={};
  for(const n2 of nietos){ const p=PADRE[n2]; (porPadre[p]=porPadre[p]||[]).push(n2); }
  for(const p in porPadre){
    if(!dest[p]) continue;
    const lista=porPadre[p], nr=Math.min(9,4.5+lista.length*1.2);
    lista.forEach((n2,j)=>{ const a=(j/lista.length)*Math.PI*2+0.7;
      dest[n2]=dest[p].clone().add(new THREE.Vector3(Math.cos(a)*nr,0,Math.sin(a)*nr)); });
  }
  if(padreId&&!dest[padreId]) dest[padreId]=new THREE.Vector3(0,0,-R*1.6);
  const desde={};
  for(const id of orden) desde[id]=mallas[id].position.clone();
  for(const id of orden){ mallas[id].userData.dest=dest[id]||new THREE.Vector3(0,-80,0); }
  const t0=performance.now(), DUR=animar?850:1;
  if(tween) cancelAnimationFrame(tween);
  const paso=(t)=>{
    const k=easeInOutCubic(clamp01((t-t0)/DUR));
    for(const id of orden){
      const m=mallas[id], u=m.userData, d=u.dest;
      const debe=!!dest[id];
      if(debe&&!u.vis){ u.vis=true; m.visible=true; u.halo.visible=true; u.etiqueta.visible=true; }
      m.position.lerpVectors(desde[id],d,k);
      if(k>=1&&!debe&&u.vis){ u.vis=false; m.visible=false; u.halo.visible=false; u.etiqueta.visible=false; }
    }
    if(k<1) tween=requestAnimationFrame(paso); else tween=null;
  };
  tween=requestAnimationFrame(paso);
  aplicarEstado();
  reconstruirAristas();
  resetParticulas();
  renderMigas();
  moverCamara(CAMD[Math.min(path.length,2)]);
}

/* ---- interacción ---- */
function pick(e){
  raton.x=(e.clientX/innerWidth)*2-1; raton.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(raton,camera);
  const objs=orden.filter(id=>mallas[id].userData.vis).map(id=>mallas[id]);
  const hit=ray.intersectObjects(objs,false)[0];
  return hit?hit.object.userData.id:null;
}
function mostrarDetalle(id){
  const n=NODOS[id];
  document.getElementById('d-nombre').innerHTML='<span class="dot" style="background:'+n.color+'"></span>'+n.nombre;
  document.getElementById('d-desc').textContent=n.desc||'';
  const nh=hijosDe(id).length;
  document.getElementById('d-meta').textContent=nh?nh+' SUBNODOS · TOCA PARA ENTRAR':'NODO FINAL';
  detalleEl.classList.remove('vis'); void detalleEl.offsetWidth; detalleEl.classList.add('vis');
}
let movido=0;
const cvs=renderer.domElement;
cvs.addEventListener('pointermove',e=>{ movido+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0); });
cvs.addEventListener('pointerdown',()=>{ movido=0; });
cvs.addEventListener('pointerup',e=>{
  if(movido<8){
    const id=pick(e);
    if(id){
      if(hijosDe(id).length){ navegar(path.concat([id])); }
      else mostrarDetalle(id);
    } else detalleEl.classList.remove('vis');
  }
});
document.getElementById('d-cerrar').onclick=()=>detalleEl.classList.remove('vis');
atrasBtn.onclick=()=>{ if(path.length) navegar(path.slice(0,-1)); };
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data) return;
  if(e.data.type==='nassar-descs'&&e.data.descs){
    for(const id in mallas){ const t=e.data.descs[mallas[id].userData.nombre];
      if(t) NODOS[id].desc=t; }
  }
});
if(window.__nassarQ&&window.__nassarQ.length) window.__nassarQ.splice(0).forEach(()=>{});

/* ---- bucle ---- */
function resize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
let primerFrame=true;
navegar([],false);
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  controls.update();
  for(const id of orden){
    const m=mallas[id], u=m.userData;
    if(!u.vis) continue;
    u.halo.material.opacity=u.hop+Math.sin(t*1.3+u.fase)*0.04;
    u.halo.position.copy(m.position);
    u.etiqueta.position.set(m.position.x,m.position.y+u.r+1.6,m.position.z);
    u.etiqueta.material.opacity=0.95;
  }
  actualizarAristas();
  actualizarParticulas(dt);
  renderer.render(scene,camera);
  if(primerFrame){ primerFrame=false;
    setTimeout(()=>{ document.getElementById('intro').style.opacity='0'; },400); }
});

__ok=true;
</script>
