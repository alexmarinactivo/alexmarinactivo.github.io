const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };

function rr(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }

// ================= TEXTURAS PROCEDURALES =================
function glowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,.55)');

  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();

function nebulaTex(){
  const c=document.createElement('canvas'); c.width=1024; c.height=512;
  const x=c.getContext('2d');
  x.fillStyle='#04060c'; x.fillRect(0,0,1024,512);
  const tonos=['10,22,51','26,16,51','10,42,51','20,14,44','8,30,58'];
  for(let i=0;i<46;i++){
    const px=Math.random()*1024, py=Math.random()*512, r=90+Math.random()*220;
    const g=x.createRadialGradient(px,py,0,px,py,r);
    const t=tonos[(Math.random()*tonos.length)|0];
    g.addColorStop(0,`rgba(${t},${0.10+Math.random()*0.10})`);
    g.addColorStop(1,`rgba(${t},0)`);
    x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
  }
  // unas vetas doradas/cian muy tenues, casi subliminales
  for(let i=0;i<10;i++){
    const px=Math.random()*1024, py=Math.random()*512, r=40+Math.random()*90;
    const g=x.createRadialGradient(px,py,0,px,py,r);
    const col = Math.random()<0.5 ? '255,213,79' : '77,208,225';
    g.addColorStop(0,`rgba(${col},0.05)`); g.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

function gridTex(){
  const S=1024, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d'); const cx=S/2, cy=S/2;
  x.strokeStyle='rgba(120,200,255,0.55)'; x.lineWidth=1.4;
  for(let r=64;r<=512;r+=64){ x.beginPath(); x.arc(cx,cy,r,0,7); x.stroke(); }
  for(let i=0;i<24;i++){ const a=i/24*Math.PI*2;
    x.beginPath(); x.moveTo(cx+Math.cos(a)*64, cy+Math.sin(a)*64);
    x.lineTo(cx+Math.cos(a)*512, cy+Math.sin(a)*512); x.stroke(); }
  // ticks exteriores
  x.lineWidth=3;
  for(let i=0;i<72;i++){ const a=i/72*Math.PI*2;
    x.beginPath(); x.moveTo(cx+Math.cos(a)*492, cy+Math.sin(a)*492);
    x.lineTo(cx+Math.cos(a)*512, cy+Math.sin(a)*512); x.stroke(); }
  // fundido radial
  x.globalCompositeOperation='destination-in';
  const g=x.createRadialGradient(cx,cy,0,cx,cy,512);
  g.addColorStop(0,'rgba(0,0,0,0.9)'); g.addColorStop(0.55,'rgba(0,0,0,0.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}

function shaftTex(){

  g.addColorStop(0.62,'rgba(255,240,200,0.28)'); g.addColorStop(1,'rgba(255,240,200,0)');
  x.fillStyle=g; x.fillRect(0,0,64,256);
  return new THREE.CanvasTexture(c);
}

function capaEstrellas(n, rMin, rMax, tam, op){
  const pos=new Float32Array(n*3), col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=rMin+Math.random()*(rMax-rMin);
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph)*0.7; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const t=Math.random(); // blanco / azulado / dorado tenue
    const cc = t<0.6 ? [1,1,1] : (t<0.85 ? [0.7,0.85,1] : [1,0.9,0.7]);
    const b=0.35+Math.random()*0.65;
    col[i*3]=cc[0]*b; col[i*3+1]=cc[1]*b; col[i*3+2]=cc[2]*b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const p=new THREE.Points(g, new THREE.PointsMaterial({ size:tam, vertexColors:true, transparent:true,
    opacity:op, depthWrite:false, fog:false, sizeAttenuation:true }));
  scene.add(p); return p;
}

// ================= MATERIALES TSL =================
function materialNodo(hex){
  const mat = new THREE.MeshBasicNodeMaterial();
  const uAmp = uniform(0.16), uBright = uniform(1.55), uPhase = uniform(Math.random()*6.28);
  mat.colorNode = color(hex).mul(uBright).mul(
    float(1).sub(uAmp).add(uAmp.mul(float(0.5).add(float(0.5).mul(sin(time.mul(float(1.6)).add(uPhase))))))
  );
  mat.userData = { uAmp, uBright };
  return mat;
}
// Tubo de flujo de datos: estelas luminosas que viajan por la arista
function materialFlujo({ conTinte, colorBase, velocidad, anchoCabeza, base, pico, brillo }){
  const mat = new THREE.MeshBasicNodeMaterial();
  mat.transparent = true; mat.blending = THREE.AdditiveBlending;
  mat.depthWrite = false; mat.fog = false;
  const d = fract(uv().x.sub(time.mul(float(velocidad))).add(attribute('aPhase')));
  const cabeza = float(1).sub(smoothstep(float(0), float(anchoCabeza), d));
  const resplandor = float(base).add(float(pico).mul(cabeza));
  const tinta = conTinte ? attribute('aTint') : color(colorBase);
  mat.colorNode = tinta.mul(resplandor).mul(float(brillo));
  return mat;
}

// ================= NODOS =================
const POS = {};

let ordenNacimiento = 0;

function etiqueta(texto, colr, fs, grande){
  const c=document.createElement('canvas');
  let x=c.getContext('2d');
  const font=`600 ${fs}px -apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif`;
  x.font=font;
  try{ x.letterSpacing = grande ? '5px' : '3px'; }catch(e){}
  const tw=x.measureText(texto).width;
  const padX=24, padY=15;
  c.width=Math.ceil(tw+padX*2); c.height=fs+padY*2;
  x=c.getContext('2d');
  const r=c.height/2;
  x.fillStyle='rgba(5,8,16,0.60)'; x.strokeStyle='rgba(150,190,255,0.20)'; x.lineWidth=2;
  rr(x,2,2,c.width-4,c.height-4,r-2); x.fill(); x.stroke();
  x.font=font;
  try{ x.letterSpacing = grande ? '5px' : '3px'; }catch(e){}
  x.textBaseline='middle'; x.fillStyle=colr;
  x.shadowColor='rgba(0,0,0,0.9)'; x.shadowBlur=8;
  x.fillText(texto, padX, c.height/2+2);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false, fog:false }));
  const k=0.052;
  s.scale.set(c.width*k, c.height*k, 1);
  s.renderOrder=5;
  return s;
}

function addNodo(nombre, desc, colr, pos, radio, fsLabel, grande, nacimiento){
  const mat = materialNodo(colr);
  const m = new THREE.Mesh(new THREE.SphereGeometry(radio, 28, 28), mat);
  m.position.copy(pos);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:GLOW, color:colr, transparent:true,
    opacity:0.5, depthWrite:false, fog:false, blending:THREE.AdditiveBlending }));
  const baseHalo = radio*8.5;
  halo.scale.set(baseHalo, baseHalo, 1);
  halo.position.copy(pos); halo.renderOrder=4;
  scene.add(halo);
  m.userData = { nombre, desc, color:colr, halo, baseHalo,
    uAmp:mat.userData.uAmp, uBright:mat.userData.uBright,
    state:'normal', nacimiento, etiqueta:null };
  scene.add(m); nodosMalla.push(m); nodosPorNombre[nombre]=m;
  POS[nombre]=pos.clone();
  if(fsLabel){
    const lab=etiqueta(nombre, '#f2f6ff', fsLabel, grande);
    lab.position.copy(pos).add(new THREE.Vector3(0, radio+4.4, 0));
    lab.material.opacity=0;
    scene.add(lab);
    m.userData.etiqueta=lab;
  }
  m.scale.setScalar(0.0001);
  halo.scale.set(0.0001,0.0001,1);
  return m;
}

// --- cerebro central ---
const centroPos = new THREE.Vector3(0,0,0);

// --- 5 secciones en anillo ---
const R = 34;
const anillosHub = [];
GRUPOS.forEach((g,i)=>{
  const ang=(i/GRUPOS.length)*Math.PI*2 - Math.PI/2;
  const hp=new THREE.Vector3(Math.cos(ang)*R, 0, Math.sin(ang)*R);
  // plataforma holográfica
  const disc=new THREE.Mesh(new THREE.CircleGeometry(14.5, 56),
    new THREE.MeshBasicMaterial({ color:g.color, transparent:true, opacity:0.055, depthWrite:false, fog:false }));
  disc.rotation.x=-Math.PI/2; disc.position.copy(hp).add(new THREE.Vector3(0,-7.5,0));
  scene.add(disc);
  const ring=new THREE.Mesh(new THREE.RingGeometry(14.1, 14.5, 72),
    new THREE.MeshBasicMaterial({ color:g.color, transparent:true, opacity:0.42, depthWrite:false,
      side:THREE.DoubleSide, fog:false }));
  ring.rotation.x=-Math.PI/2; ring.position.copy(disc.position);
  scene.add(ring);
  // anillo orbital fino del hub
  const orb=new THREE.Mesh(new THREE.TorusGeometry(3.8, 0.05, 8, 90),
    new THREE.MeshBasicMaterial({ color:g.color, transparent:true, opacity:0.5, fog:false, depthWrite:false }));
  const og=new THREE.Group(); og.add(orb); og.position.copy(hp);
  og.rotation.x=0.55; og.rotation.z=0.2+i*0.15; og.userData.vel=0.3+i*0.06;
  scene.add(og); anillosHub.push(og);

  addNodo(g.nombre, "Sección: "+g.nombre+". Toca sus nodos para ver cada pieza.", g.color, hp, 2.0, 40, true, 0.9+i*0.18);
  const cartel=etiqueta("SECCIÓN · "+g.nombre.toUpperCase(), g.color, 30, true);
  cartel.position.copy(hp).add(new THREE.Vector3(0, 13.5, 0));
  cartel.material.opacity=0;
  scene.add(cartel);
  nodosPorNombre[g.nombre].userData.etiqueta2=cartel;

  g.nodos.forEach(([nom,des],j)=>{
    const m=g.nodos.length, ph=Math.acos(1-2*(j+0.5)/m), th=Math.PI*(1+Math.sqrt(5))*j+1.3;
    const r2=9.5;
    const lp=hp.clone().add(new THREE.Vector3(r2*Math.sin(ph)*Math.cos(th), r2*Math.cos(ph)*0.75, r2*Math.sin(ph)*Math.sin(th)));
    addNodo(nom, des, g.color, lp, 1.0, 30, false, 1.5+(ordenNacimiento++)*0.045);
  });
});

// ================= ARISTAS: tubos de flujo =================
function mergeTubos(items){
  let vCount=0, iCount=0;
  for(const it of items){ vCount+=it.geo.attributes.position.count; iCount+=it.geo.index.count; }
  const pos=new Float32Array(vCount*3), nor=new Float32Array(vCount*3), uvA=new Float32Array(vCount*2);
  const tint=new Float32Array(vCount*3), phase=new Float32Array(vCount);
  const idx=new (vCount>65535?Uint32Array:Uint16Array)(iCount);
  let vo=0, io=0;
  for(const it of items){
    const g=it.geo, n=g.attributes.position.count;
    pos.set(g.attributes.position.array, vo*3);
    nor.set(g.attributes.normal.array, vo*3);
    uvA.set(g.attributes.uv.array, vo*2);
    for(let i=0;i<n;i++){ tint[(vo+i)*3]=it.tint[0]; tint[(vo+i)*3+1]=it.tint[1]; tint[(vo+i)*3+2]=it.tint[2]; phase[vo+i]=it.phase; }
    const ia=g.index.array;
    for(let i=0;i<ia.length;i++) idx[io+i]=ia[i]+vo;
    vo+=n; io+=ia.length; g.dispose();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvA,2));
  geo.setAttribute('aTint', new THREE.BufferAttribute(tint,3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase,1));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  return geo;
}
const tubosPrim=[], tubosCross=[];
function tuboRecto(a,b,r){
  return new THREE.TubeGeometry(new THREE.LineCurve3(a.clone(), b.clone()), 20, r, 6, false);
}
// primarias: el flujo viaja HACIA el centro (a=origen -> b=destino)
GRUPOS.forEach(g=>{
  const hp=POS[g.nombre], t=hexRgb(g.color);
  tubosPrim.push({ geo:tuboRecto(hp, centroPos, 0.30), tint:t, phase:Math.random() });
  g.nodos.forEach(([nom])=>{ tubosPrim.push({ geo:tuboRecto(POS[nom], hp, 0.22), tint:t, phase:Math.random() }); });
});
// cross-links: arcos elevados, finos y tenues
CROSS.forEach(([a,b])=>{
  const pa=POS[a], pb=POS[b];
  if(!pa||!pb) return;
  const mid=pa.clone().add(pb).multiplyScalar(0.5);
  const ctrl=mid.clone(); ctrl.y+= (a==="CEREBRO"||b==="CEREBRO") ? 12 : 16;
  const curve=new THREE.QuadraticBezierCurve3(pa.clone(), ctrl, pb.clone());
  tubosCross.push({ geo:new THREE.TubeGeometry(curve, 42, 0.10, 6, false), tint:[0.55,0.72,0.91], phase:Math.random() });
});
const mallaPrim=new THREE.Mesh(mergeTubos(tubosPrim),
  materialFlujo({ conTinte:true, velocidad:0.30, anchoCabeza:0.30, base:0.30, pico:2.6, brillo:1.0 }));
mallaPrim.renderOrder=2; mallaPrim.frustumCulled=false;
scene.add(mallaPrim);
const mallaCross=new THREE.Mesh(mergeTubos(tubosCross),
  materialFlujo({ conTinte:true, velocidad:0.18, anchoCabeza:0.20, base:0.20, pico:1.7, brillo:0.55 }));
mallaCross.renderOrder=2; mallaCross.frustumCulled=false;
scene.add(mallaCross);

// ================= POSTPROCESADO =================
const renderPipeline = new THREE.RenderPipeline(renderer);
const scenePass = pass(scene, camera);
const scenePassColor = scenePass.getTextureNode('output');
const bloomPass = bloom(scenePassColor, 0.65, 0.55, 0.62); // calibrado: brillo sin quemar
renderPipeline.outputNode = scenePassColor.add(bloomPass);

// ================= CONTROLES =================
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,2,0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false;
controls.autoRotate = !reducido; controls.autoRotateSpeed=0.55;
controls.minDistance=38; controls.maxDistance=150;
controls.maxPolarAngle=Math.PI*0.74; controls.minPolarAngle=Math.PI*0.16;
controls.enabled=false; // hasta que termine la apertura
controls.update();

// ================= INTERACCIÓN =================
const ray=new THREE.Raycaster(), raton=new THREE.Vector2();
const tarjeta=document.getElementById('tarjeta');
function mostrar(n){
  document.getElementById('t-nombre').textContent=n.userData.nombre;
  document.getElementById('t-desc').textContent=n.userData.desc||'';
  document.getElementById('t-nombre').style.color=n.userData.color;
  tarjeta.style.display = n.userData.desc ? 'block':'none';
  const mm=MAPA_NODO_MISION[n.userData.nombre];
  if(mm){ bVerMision.style.display='inline-block';
    bVerMision.onclick=()=>{ try{ parent.postMessage({type:'nassar-ver-mision',mision:mm},location.origin); }catch(e){} };
  } else bVerMision.style.display='none';
}
document.getElementById('cerrar').onclick=()=>tarjeta.style.display='none';
let px=0, py=0, movido=0;
canvas.addEventListener('pointerdown',e=>{ px=e.clientX; py=e.clientY; movido=0; if(!tween) controls.autoRotate=!reducido; });
canvas.addEventListener('pointermove',e=>{ movido+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0); });
canvas.addEventListener('pointerup',e=>{
  if(movido<8){
    raton.x=(e.clientX/innerWidth)*2-1; raton.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(raton,camera);
    const hit=ray.intersectObjects(nodosMalla)[0];
    if(hit) mostrar(hit.object); else { tarjeta.style.display='none'; limpiarFoco(); }
  }
});

// ================= ESTADOS DE MISIÓN (lo activo se ve) =================
function aplicarEstado(nodo, estado){
  const u=nodo.userData;
  if(estado==='activo' || estado==='en_curso'){
    u.state='hot';
    u.uAmp.value=0.42; u.uBright.value=2.1;
    u.halo.scale.set(u.baseHalo*1.7, u.baseHalo*1.7, 1);
    u.halo.material.opacity=0.8;
  } else if(estado==='pendiente'){
    u.state='dim';
    u.uAmp.value=0.05; u.uBright.value=0.7;
    u.halo.scale.set(u.baseHalo*0.75, u.baseHalo*0.75, 1);
    u.halo.material.opacity=0.25;
  } else {
    u.state='normal';
    u.uAmp.value=0.16; u.uBright.value = (u.nombre==="CEREBRO") ? 1.9 : 1.55;
    u.halo.scale.set(u.baseHalo, u.baseHalo, 1);
    u.halo.material.opacity=0.5;
  }
}

// ================= MENSAJES DESDE LA APP =================
addEventListener('message', e=>{
  if(!e.data) return;
  if(e.data.type==='nassar-descs' && e.data.descs){
    nodosMalla.forEach(m=>{
      const d=e.data.descs[m.userData.nombre];
      if(d) m.userData.desc=d;
    });
  }
  if(e.data.type==='nassar-misiones' && Array.isArray(e.data.misiones)){
    e.data.misiones.forEach(mi=>{
      const nn=MAPA_MISIONES[mi.nombre];
      if(!nn) return; // "App Nassar en vivo" no es nodo: se ignora
      const nodo=nodosPorNombre[nn];
      if(nodo) aplicarEstado(nodo, mi.estado);
    });
  }
});

// leyenda
document.getElementById('leyenda').innerHTML =
  `<div><span class="dot" style="background:${CENTRO.color};color:${CENTRO.color}"></span>Cerebro central</div>` +
  GRUPOS.map(g=>`<div><span class="dot" style="background:${g.color};color:${g.color}"></span>${g.nombre}</div>`).join('');

// ================= BUCLE =================
function resize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
let introT = reducido ? 1 : 0;
let primerFrame=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(), 0.05);
  const t=clock.elapsedTime;
  // apertura cinematográfica
  if(introT<1){
    introT=Math.min(1, introT+dt/3.4);
    const k=easeInOutCubic(introT);
    camera.position.lerpVectors(camStart, camEnd, k);
    camera.lookAt(0,2,0);
    if(introT>=1){ controls.enabled=true;
      if(focusPendiente){ const fp=focusPendiente; focusPendiente=null; enfocar(fp); } }
  } else if(!controls.enabled){ controls.enabled=true; }
  if(tween){
    tween.t+=dt/tween.dur;
    const k=easeInOutCubic(Math.min(1,tween.t));
    camera.position.lerpVectors(tween.fromP,tween.toP,k);
    controls.target.lerpVectors(tween.fromT,tween.toT,k);
    if(tween.t>=1) tween=null;
  }
  controls.update();
  // aparición escalonada de nodos
  for(const n of nodosMalla){
    const u=n.userData;
    const s=easeOutBack(clamp01((t-u.nacimiento)/0.6));
    const sc=Math.max(0.0001, s);
    n.scale.setScalar(sc);
    const foc=(n===focoNodo)?2.1:1;
    const hs=Math.max(0.0001, u.baseHalo*(u.state==='hot'?1.7:u.state==='dim'?0.75:1)*foc*s);
    u.halo.scale.set(hs,hs,1);
    if(u.etiqueta) u.etiqueta.material.opacity=clamp01((t-u.nacimiento-0.25)/0.5);
    if(u.etiqueta2) u.etiqueta2.material.opacity=clamp01((t-u.nacimiento-0.25)/0.5);
  }
  // vida ambiental
  anilloP1.rotation.y+=dt*0.020; anilloP2.rotation.y-=dt*0.014;
  for(const g of anillosNucleo) g.rotation.y+=dt*g.userData.vel;
  for(const g of anillosHub) g.rotation.y+=dt*g.userData.vel;
  reticula.rotation.z+=dt*0.004;
  estrellas2.rotation.y+=dt*0.0022;
  haz.material.opacity=0.065+0.022*Math.sin(t*0.8);
  renderPipeline.render();
  if(primerFrame){ primerFrame=false;
    setTimeout(()=>{ document.getElementById('intro').style.opacity='0'; }, 350); }
});

// ================= FOCO PANEL <-> CEREBRO =================
const MAPA_NODO_MISION={};
for(const k in MAPA_MISIONES) MAPA_NODO_MISION[MAPA_MISIONES[k]]=k;
const bVerMision=document.getElementById('b-ver-mision');
let focoNodo=null, tween=null, focusPendiente=null;

function limpiarFoco(){
  const n=focoNodo; focoNodo=null;
  if(!n||!n.userData._snap) return;
  const s=n.userData._snap, u=n.userData;
  u.uAmp.value=s.amp; u.uBright.value=s.bright; u.halo.material.opacity=s.hop;
}
function enfocar(nombreMision){
  const nn=MAPA_MISIONES[nombreMision]||(nodosPorNombre[nombreMision]?nombreMision:null);
  const n=nn?nodosPorNombre[nn]:null;
  if(!n) return;
  if(introT<1){ focusPendiente=nombreMision; return; }
  limpiarFoco();
  const u=n.userData;
  u._snap={amp:u.uAmp.value, bright:u.uBright.value, hop:u.halo.material.opacity};
  u.uAmp.value=0.5; u.uBright.value=2.6; u.halo.material.opacity=0.95;
  focoNodo=n;
  mostrar(n);
  const dir=camera.position.clone().sub(controls.target).normalize();
  tween={t:0,dur:1.15,
    fromP:camera.position.clone(), toP:n.position.clone().add(dir.multiplyScalar(42)),
    fromT:controls.target.clone(), toT:n.position.clone()};
  controls.autoRotate=false;
}
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data) return;
  if(e.data.type==='nassar-focus') enfocar(e.data.mision);
});
if(window.__nassarQ&&window.__nassarQ.length){
  window.__nassarQ.splice(0).forEach(d=>{ try{enfocar(d.mision);}catch(e){} });
}
</script>
