<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La plataforma de Nassar Intelligence</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #c { position:fixed; inset:0; display:block; touch-action:none; }
  #titulo { position:fixed; top:14px; left:0; right:0; text-align:center; color:#fff;
    pointer-events:none; z-index:5; }
  #titulo h1 { font-size:19px; letter-spacing:1px; }
  #titulo p { font-size:12px; color:#8a93a6; margin-top:4px; }
  #leyenda { position:fixed; top:14px; left:14px; z-index:5; background:rgba(10,12,18,.72);
    border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 12px;
    color:#cfd6e4; font-size:12px; line-height:1.9; backdrop-filter:blur(6px); }
  #leyenda .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  #tarjeta { position:fixed; left:14px; right:14px; bottom:16px; z-index:6; display:none;
    background:rgba(12,14,22,.92); border:1px solid rgba(255,255,255,.15); border-radius:16px;
    padding:16px 18px; color:#fff; backdrop-filter:blur(8px); }
  #tarjeta h2 { font-size:18px; margin-bottom:6px; }
  #tarjeta p { font-size:14px; color:#aeb6c8; line-height:1.5; }
  #tarjeta .cerrar { position:absolute; top:8px; right:14px; color:#8a93a6; font-size:22px;
    cursor:pointer; padding:4px; }
  #ayuda { position:fixed; bottom:16px; left:0; right:0; text-align:center; color:#5b6478;
    font-size:12px; pointer-events:none; z-index:5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="titulo"><h1>EL CEREBRO · NASSAR</h1><p>El cerebro en el centro · 5 secciones · Toca un nodo</p></div>
<div id="leyenda"></div>
<div id="tarjeta"><span class="cerrar" id="cerrar">×</span><h2 id="t-nombre"></h2><p id="t-desc"></p></div>
<div id="ayuda">Arrastra para girar · Pellizca o rueda para acercar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- DATOS ----------
const GRUPOS = [
  { id:"misiones", nombre:"Misiones de dinero", color:"#66BB6A", nodos:[
    ["Producto nuevo","Detalle en la vista En vivo."],
    ["Crypto","Detalle en la vista En vivo."],
    ["Forex demo","Detalle en la vista En vivo."],
    ["Vinted","Detalle en la vista En vivo."]]},
  { id:"cerebros", nombre:"Cerebros IA", color:"#4DD0E1", nodos:[
    ["El Consejo","Detalle en la vista En vivo."],
    ["Copiloto","Detalle en la vista En vivo."]]},
  { id:"radar", nombre:"Radar y caza", color:"#F06292", nodos:[
    ["Radar IA","Detalle en la vista En vivo."],
    ["Laboratorio","Detalle en la vista En vivo."],
    ["Bóveda","Detalle en la vista En vivo."],
    ["Dieta de información","Detalle en la vista En vivo."]]},
  { id:"vida", nombre:"Vida y trámites", color:"#FFA726", nodos:[
    ["Canje permiso","Detalle en la vista En vivo."],
    ["Cita INSS","Detalle en la vista En vivo."],
    ["Vuelo","Detalle en la vista En vivo."],
    ["Finanzas","Detalle en la vista En vivo."],
    ["Privacidad","Detalle en la vista En vivo."],
    ["Familia","Detalle en la vista En vivo."]]},
  { id:"cap", nombre:"Capacidades", color:"#7986CB", nodos:[
    ["Navegador","Detalle en la vista En vivo."],
    ["Memoria","Detalle en la vista En vivo."],
    ["Investigación","Detalle en la vista En vivo."],
    ["Artefactos","Detalle en la vista En vivo."],
    ["Spotify","Detalle en la vista En vivo."]]}
];
const CENTRO = { nombre:"CEREBRO", desc:"Nassar Intelligence: tu agente personal. Este cerebro alimenta a las 5 secciones y lo orquesta todo. Tú solo decides lo imprescindible.", color:"#FFD54F" };

// ---------- ESCENA ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.FogExp2(0x05060a, 0.010);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 10, 78);

const mundo = new THREE.Group();
scene.add(mundo);

function glowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.35,'rgba(255,255,255,.45)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();

function etiqueta(texto, color, fs){
  const c=document.createElement('canvas'); const x=c.getContext('2d');
  x.font=`bold ${fs}px sans-serif`;
  const w=Math.ceil(x.measureText(texto).width)+40;
  c.width=w; c.height=fs+44;
  const x2=c.getContext('2d');
  x2.font=`bold ${fs}px sans-serif`; x2.textBaseline='middle';
  x2.shadowColor='rgba(0,0,0,.9)'; x2.shadowBlur=10;
  x2.fillStyle=color; x2.fillText(texto,20,c.height/2);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthWrite:false}));
  const escala=0.045;
  s.scale.set(c.width*escala, c.height*escala, 1);
  return s;
}

const nodosMalla=[]; const lineasPts=[];
function addNodo(nombre, desc, color, pos, radio, fsLabel){
  const m=new THREE.Mesh(new THREE.SphereGeometry(radio,24,24), new THREE.MeshBasicMaterial({color}));
  m.position.copy(pos); m.userData={nombre,desc,color};
  mundo.add(m); nodosMalla.push(m);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));
  glow.scale.set(radio*7,radio*7,1); glow.position.copy(pos); mundo.add(glow);
  if(fsLabel){
    const lab=etiqueta(nombre,color,fsLabel);
    lab.position.copy(pos).add(new THREE.Vector3(0,radio+3.2,0));
    mundo.add(lab);
  }
  return m;
}

// --- cerebro central ---
const centroPos = new THREE.Vector3(0,0,0);
addNodo(CENTRO.nombre, CENTRO.desc, CENTRO.color, centroPos, 3.2, 52);

// --- 5 secciones en anillo, como una plataforma ---
const R = 34;
GRUPOS.forEach((g,i)=>{
  const ang = (i/GRUPOS.length)*Math.PI*2 - Math.PI/2;
  const hp = new THREE.Vector3(Math.cos(ang)*R, 0, Math.sin(ang)*R);

  // plataforma de la sección: disco translúcido + anillo
  const disc = new THREE.Mesh(new THREE.CircleGeometry(14, 48),
    new THREE.MeshBasicMaterial({color:g.color, transparent:true, opacity:0.07, depthWrite:false}));
  disc.rotation.x = -Math.PI/2; disc.position.copy(hp).add(new THREE.Vector3(0,-7,0));
  mundo.add(disc);
  const ring = new THREE.Mesh(new THREE.RingGeometry(13.7, 14, 64),
    new THREE.MeshBasicMaterial({color:g.color, transparent:true, opacity:0.35, depthWrite:false, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.copy(disc.position);
  mundo.add(ring);

  // hub de la sección
  const hub = addNodo(g.nombre, "Sección: "+g.nombre+". Toca sus nodos para ver cada pieza.", g.color, hp, 1.9, 44);
  lineasPts.push(centroPos.clone(), hp.clone());

  // cartel de sección flotante
  const cartel = etiqueta("SECCIÓN · "+g.nombre.toUpperCase(), g.color, 34);
  cartel.position.copy(hp).add(new THREE.Vector3(0, 12, 0));
  mundo.add(cartel);

  // nodos de la sección alrededor del hub
  g.nodos.forEach(([nom,des],j)=>{
    const m=g.nodos.length, ph=Math.acos(1-2*(j+0.5)/m), th=Math.PI*(1+Math.sqrt(5))*j+1.3;
    const r2=9.5;
    const lp=hp.clone().add(new THREE.Vector3(r2*Math.sin(ph)*Math.cos(th), r2*Math.cos(ph)*0.75, r2*Math.sin(ph)*Math.sin(th)));
    addNodo(nom,des,g.color,lp,1.0,32);
    lineasPts.push(hp.clone(), lp.clone());
  });
});
const lg=new THREE.BufferGeometry().setFromPoints(lineasPts);
mundo.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x8a93a6,transparent:true,opacity:0.35})));

// conexiones extra: el cerebro también alimenta directo a nodos clave
// (líneas tenues centro -> cada hub ya incluidas)

// partículas doradas
(function(){
  const N=400, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-0.5)*200; pos[i*3+1]=(Math.random()-0.5)*120; pos[i*3+2]=(Math.random()-0.5)*200; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  mundo.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xFFD54F,size:0.4,transparent:true,opacity:0.45})));
})();

// leyenda
document.getElementById('leyenda').innerHTML =
  `<div><span class="dot" style="background:${CENTRO.color}"></span>Cerebro central</div>` +
  GRUPOS.map(g=>`<div><span class="dot" style="background:${g.color}"></span>${g.nombre}</div>`).join('');

// ---------- INTERACCIÓN ----------
const ray=new THREE.Raycaster(), raton=new THREE.Vector2();
const tarjeta=document.getElementById('tarjeta');
function mostrar(n){
  document.getElementById('t-nombre').textContent=n.userData.nombre;
  document.getElementById('t-desc').textContent=n.userData.desc||'';
  document.getElementById('t-nombre').style.color=n.userData.color;
  tarjeta.style.display = n.userData.desc ? 'block':'none';
}
document.getElementById('cerrar').onclick=()=>tarjeta.style.display='none';

let velX=0.0016, velY=0, arrastrando=false, px=0, py=0, movido=0;
canvas.addEventListener('pointerdown',e=>{arrastrando=true;px=e.clientX;py=e.clientY;movido=0;});
addEventListener('pointermove',e=>{
  if(!arrastrando) return;
  const dx=e.clientX-px, dy=e.clientY-py; movido+=Math.abs(dx)+Math.abs(dy);
  velY=dx*0.00022; velX=dy*0.00012;
  mundo.rotation.y+=dx*0.005; mundo.rotation.x+=dy*0.003;
  mundo.rotation.x=Math.max(-0.9,Math.min(0.9,mundo.rotation.x));
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup',e=>{
  if(arrastrando && movido<8){
    raton.x=(e.clientX/innerWidth)*2-1; raton.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(raton,camera);
    const hit=ray.intersectObjects(nodosMalla)[0];
    if(hit) mostrar(hit.object); else tarjeta.style.display='none';
  }
  arrastrando=false;
});
let dist=78;
addEventListener('wheel',e=>{dist=Math.max(38,Math.min(140,dist+e.deltaY*0.05));},{passive:true});
let pd=0;
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pd) dist=Math.max(38,Math.min(140,dist-(d-pd)*0.15));
    pd=d;
  }
},{passive:true});
canvas.addEventListener('touchend',()=>pd=0);

function resize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize();


addEventListener('message', e=>{
  if(e.data && e.data.type==='nassar-descs' && e.data.descs){
    nodosMalla.forEach(m=>{
      const d=e.data.descs[m.userData.nombre];
      if(d) m.userData.desc=d;
    });
  }
});
(function loop(){
  requestAnimationFrame(loop);
  if(!arrastrando){ mundo.rotation.y+=velX; mundo.rotation.x+=velY;
    velY*=0.95; velX=velX*0.98+0.0016*0.02; }
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(camera.quaternion);
  camera.position.copy(dir.multiplyScalar(dist)).add(new THREE.Vector3(0,8,0));
  camera.lookAt(0,1,0);
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
