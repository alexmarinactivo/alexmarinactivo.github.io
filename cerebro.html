<style>
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04060c;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; }
  #c { position:fixed; inset:0; display:block; touch-action:none; }
  #vineta { position:fixed; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(1,2,8,.34) 80%, rgba(0,1,6,.68) 100%); }
  #sombra-top { position:fixed; top:0; left:0; right:0; height:110px; pointer-events:none; z-index:3;
    background:linear-gradient(rgba(2,3,8,.6), transparent); }
  #titulo { position:fixed; top:16px; left:0; right:0; text-align:center; color:#fff;
    pointer-events:none; z-index:5; animation:aparicion 1.4s ease .9s both; }
  #titulo h1 { margin:0; font-size:20px; letter-spacing:4px; font-weight:700;

  #leyenda .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px;
    box-shadow:0 0 8px currentColor; }
  #tarjeta { position:fixed; left:14px; right:14px; bottom:16px; z-index:6; display:none;
    background:rgba(8,11,20,.92); border:1px solid rgba(140,180,255,.22); border-radius:16px;
    padding:16px 18px; color:#fff; backdrop-filter:blur(10px);
    box-shadow:0 8px 40px rgba(0,0,0,.5); }
  #tarjeta h2 { margin:0 0 6px; font-size:18px; letter-spacing:1px; }
  #tarjeta p { margin:0; font-size:14px; color:#aeb6c8; line-height:1.55; }
  #tarjeta .cerrar { position:absolute; top:8px; right:14px; color:#8a93a6; font-size:22px;
    cursor:pointer; padding:4px; }
  #b-ver-mision{display:none;margin-top:12px;background:rgba(255,213,79,.14);
    border:1px solid rgba(255,213,79,.5);color:#FFD54F;font-size:14px;font-weight:700;
    padding:10px 16px;border-radius:12px;cursor:pointer}
  #ayuda { position:fixed; bottom:16px; left:0; right:0; text-align:center; color:#5b6478;
    font-size:12px; letter-spacing:1px; pointer-events:none; z-index:5;
    animation:aparicion 1.4s ease 1.6s both; }
  #intro { position:fixed; inset:0; background:#04060c; z-index:40; pointer-events:none;
    transition:opacity 1.8s ease; }
  #err3d { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:#8a93a6; font-size:14px; text-align:center; padding:30px; z-index:20; }
  @keyframes aparicion { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
</style>

<body>
<canvas id="c"></canvas>
<div id="vineta"></div>
<div id="sombra-top"></div>
<div id="titulo"><h1>EL CEREBRO <span class="dorado">·</span> NASSAR</h1><p>CENTRO DE MANDO · TODO LO ACTIVO, EN VIVO</p></div>
<div id="leyenda"></div>
<div id="tarjeta"><span class="cerrar" id="cerrar">×</span><h2 id="t-nombre"></h2><p id="t-desc"></p><button id="b-ver-mision">Ver en En vivo →</button></div>
<div id="ayuda">Arrastra para girar · Pellizca o rueda para acercar · Toca un nodo</div>
<div id="intro"></div>
<div id="err3d"><div>No se pudo iniciar el 3D en este navegador.<br>Prueba con Chrome o Safari actualizado.</div></div>

<script>
// buzón para mensajes que lleguen antes de que el módulo 3D esté listo
window.__nassarQ=[];
addEventListener('message',function(e){
  if(e.origin!==location.origin) return;
  if(e.data&&e.data.type==='nassar-focus') window.__nassarQ.push(e.data);
});
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { pass, time, uniform, color, float, sin, uv, attribute, smoothstep, fract } from 'three/tsl';
import { bloom } from 'three/addons/BloomNode.js';

// ================= DATOS (nombres exactos = claves del postMessage) =================
const GRUPOS = [
  { id:"misiones", nombre:"Misiones de dinero", color:"#66BB6A", nodos:[
    ["Producto nuevo","Detalle en la vista En vivo."],
    ["Crypto","Detalle en la vista En vivo."],
    ["Forex demo","Detalle en la vista En vivo."],
    ["Vinted","Detalle en la vista En vivo."]]},
  { id:"cerebros", nombre:"Cerebros IA", color:"#4DD0E1", nodos:[
    ["El Consejo","Detalle en la vista En vivo."],
    ["Copiloto","Detalle en la vista En vivo."]]},
  { id:"radar", nombre:"Radar y caza", color:"#F06292", nodos:[
    ["Radar IA","Detalle en la vista En vivo."],
    ["Laboratorio","Detalle en la vista En vivo."],
    ["Bóveda","Detalle en la vista En vivo."],
    ["Dieta de información","Detalle en la vista En vivo."]]},
  { id:"vida", nombre:"Vida y trámites", color:"#FFA726", nodos:[
    ["Canje permiso","Detalle en la vista En vivo."],
    ["Cita INSS","Detalle en la vista En vivo."],
    ["Vuelo","Detalle en la vista En vivo."],
    ["Finanzas","Detalle en la vista En vivo."],
    ["Privacidad","Detalle en la vista En vivo."],
    ["Familia","Detalle en la vista En vivo."]]},
  { id:"cap", nombre:"Capacidades", color:"#7986CB", nodos:[
    ["Navegador","Detalle en la vista En vivo."],
    ["Memoria","Detalle en la vista En vivo."],
    ["Investigación","Detalle en la vista En vivo."],
    ["Artefactos","Detalle en la vista En vivo."],
    ["Spotify","Detalle en la vista En vivo."]]}
];
const CENTRO = { nombre:"CEREBRO", desc:"Nassar Intelligence: tu agente personal. Este cerebro alimenta a las 5 secciones y lo orquesta todo. Tú solo decides lo imprescindible.", color:"#FFD54F" };


// Misiones (index.html) -> nodo que las representa
const MAPA_MISIONES = {
  "Misión ganancias":"Producto nuevo",
  "Canje permiso marroquí":"Canje permiso",
  "Privacidad total":"Privacidad",
  "Cita INSS Villena":"Cita INSS",
  "Vuelo Tánger → Valencia":"Vuelo",
  "El Consejo":"El Consejo"
};

// ================= RENDERER =================
const canvas = document.getElementById('c');
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try {
  renderer = new THREE.WebGPURenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // presupuesto móvil
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // el truco de color de estudio
  await renderer.init();
} catch(e) {
  document.getElementById('err3d').style.display = 'flex';
  throw e;
}

// ================= ESCENA / CÁMARA =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c); // negro azulado, nunca puro
scene.fog = new THREE.FogExp2(0x04060c, 0.0072);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 700);
const camStart = new THREE.Vector3(0, 62, 168);
const camEnd = new THREE.Vector3(0, 13, 84);
camera.position.copy(reducido ? camEnd : camStart);
camera.lookAt(0, 2, 0);

// ================= HELPERS =================
const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const clamp01 = t => Math.max(0, Math.min(1, t));
function hexRgb(hex){ const n=parseInt(hex.slice(1),16); return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255]; }
function rr(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }

// ================= TEXTURAS PROCEDURALES =================
function glowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,.55)');
  g.addColorStop(0.55,'rgba(255,255,255,.14)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();

function materialNodo(hex){
  const mat = new THREE.MeshBasicNodeMaterial();
  const uAmp = uniform(0.10), uBright = uniform(1.18), uPhase = uniform(Math.random()*6.28);
  mat.colorNode = color(hex).mul(uBright).mul(
    float(1).sub(uAmp).add(uAmp.mul(float(0.5).add(float(0.5).mul(sin(time.mul(float(1.6)).add(uPhase))))))
  );
  mat.userData = { uAmp, uBright };
  return mat;
}
// Tubo de flujo de datos: estelas luminosas que viajan por la arista


// ================= NODOS =================
const POS = {};
const nodosMalla = [];
const nodosPorNombre = {};
let ordenNacimiento = 0;

function etiqueta(texto, colr, fs, grande){
  const c=document.createElement('canvas');
  let x=c.getContext('2d');
  const font=`600 ${fs}px -apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif`;
  x.font=font;
  try{ x.letterSpacing = grande ? '5px' : '3px'; }catch(e){}
  const tw=x.measureText(texto).width;
  const padX=24, padY=15;
  c.width=Math.ceil(tw+padX*2); c.height=fs+padY*2;
  x=c.getContext('2d');
  const r=c.height/2;
  x.fillStyle='rgba(5,8,16,0.60)'; x.strokeStyle='rgba(150,190,255,0.20)'; x.lineWidth=2;
  rr(x,2,2,c.width-4,c.height-4,r-2); x.fill(); x.stroke();
  x.font=font;
  try{ x.letterSpacing = grande ? '5px' : '3px'; }catch(e){}
  x.textBaseline='middle'; x.fillStyle=colr;
  x.shadowColor='rgba(0,0,0,0.9)'; x.shadowBlur=8;
  x.fillText(texto, padX, c.height/2+2);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false, fog:false }));
  const k=0.052;
  s.scale.set(c.width*k, c.height*k, 1);
  s.renderOrder=5;
  return s;
}

function addNodo(nombre, desc, colr, pos, radio, fsLabel, grande, nacimiento){
  const mat = materialNodo(colr);
  const m = new THREE.Mesh(new THREE.SphereGeometry(radio, 28, 28), mat);
  m.position.copy(pos);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:GLOW, color:colr, transparent:true,
    opacity:0.35, depthWrite:false, fog:false, blending:THREE.AdditiveBlending }));
  const baseHalo = radio*8.5;
  halo.scale.set(baseHalo, baseHalo, 1);
  halo.position.copy(pos); halo.renderOrder=4;
  scene.add(halo);
  m.userData = { nombre, desc, color:colr, halo, baseHalo,
    uAmp:mat.userData.uAmp, uBright:mat.userData.uBright,
    state:'normal', nacimiento, etiqueta:null };
  scene.add(m); nodosMalla.push(m); nodosPorNombre[nombre]=m;
  POS[nombre]=pos.clone();
  if(fsLabel){
    const lab=etiqueta(nombre, '#f2f6ff', fsLabel, grande);
    lab.position.copy(pos).add(new THREE.Vector3(0, radio+4.4, 0));
    lab.material.opacity=0;
    scene.add(lab);
    m.userData.etiqueta=lab;
  }
  m.scale.setScalar(0.0001);
  halo.scale.set(0.0001,0.0001,1);
  return m;
}

// --- cerebro central ---
const centroPos = new THREE.Vector3(0,0,0);
addNodo(CENTRO.nombre, CENTRO.desc, CENTRO.color, centroPos, 3.4, 54, true, 0.5);
nodosPorNombre["CEREBRO"].userData.uBright.value = 1.5;
// anillos orbitales del núcleo


// --- 5 secciones en anillo ---
const R = 34;
GRUPOS.forEach((g,i)=>{
  const ang=(i/GRUPOS.length)*Math.PI*2 - Math.PI/2;
  const hp=new THREE.Vector3(Math.cos(ang)*R, 0, Math.sin(ang)*R);
  addNodo(g.nombre, "Sección: "+g.nombre+". Toca sus nodos para ver cada pieza.", g.color, hp, 2.0, 40, true, 0.9+i*0.18);
  const cartel=etiqueta("SECCIÓN · "+g.nombre.toUpperCase(), g.color, 30, true);
  cartel.position.copy(hp).add(new THREE.Vector3(0, 13.5, 0));
  cartel.material.opacity=0;
  scene.add(cartel);
  nodosPorNombre[g.nombre].userData.etiqueta2=cartel;

  g.nodos.forEach(([nom,des],j)=>{
    const m=g.nodos.length, ph=Math.acos(1-2*(j+0.5)/m), th=Math.PI*(1+Math.sqrt(5))*j+1.3;
    const r2=9.5;
    const lp=hp.clone().add(new THREE.Vector3(r2*Math.sin(ph)*Math.cos(th), r2*Math.cos(ph)*0.75, r2*Math.sin(ph)*Math.sin(th)));
    addNodo(nom, des, g.color, lp, 1.0, 30, false, 1.5+(ordenNacimiento++)*0.045);
  });
});

// ================= ARISTAS: líneas finas + partículas viajeras =================
const aristas=[];
GRUPOS.forEach(g=>{
  const hp=POS[g.nombre];
  aristas.push({a:hp,b:centroPos,c:g.color});
  g.nodos.forEach(([nom])=>{ aristas.push({a:POS[nom],b:hp,c:g.color}); });
});
{
  const lp=new Float32Array(aristas.length*6), lc=new Float32Array(aristas.length*6);
  aristas.forEach((e,i)=>{
    lp[i*6]=e.a.x; lp[i*6+1]=e.a.y; lp[i*6+2]=e.a.z;
    lp[i*6+3]=e.b.x; lp[i*6+4]=e.b.y; lp[i*6+5]=e.b.z;
    const cc=hexRgb(e.c);
    lc[i*6]=cc[0]; lc[i*6+1]=cc[1]; lc[i*6+2]=cc[2];
    lc[i*6+3]=cc[0]; lc[i*6+4]=cc[1]; lc[i*6+5]=cc[2];
  });
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(lp,3));
  lg.setAttribute('color', new THREE.BufferAttribute(lc,3));
  const lineas=new THREE.LineSegments(lg, new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.32}));
  lineas.frustumCulled=false;
  scene.add(lineas);
}
// partículas doradas viajando hacia el centro por las aristas
const NP=240;
const pPos=new Float32Array(NP*3), pT=new Float32Array(NP), pEdge=new Uint16Array(NP);
for(let i=0;i<NP;i++){ pEdge[i]=(Math.random()*aristas.length)|0; pT[i]=Math.random(); }
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
const puntos=new THREE.Points(pGeo, new THREE.PointsMaterial({color:0xffe2a0,size:0.85,transparent:true,
  opacity:0.8,depthWrite:false,blending:THREE.AdditiveBlending}));
puntos.frustumCulled=false;
scene.add(puntos);

// ================= POSTPROCESADO =================
const renderPipeline = new THREE.RenderPipeline(renderer);
const scenePass = pass(scene, camera);
const scenePassColor = scenePass.getTextureNode('output');
const bloomPass = bloom(scenePassColor, 0.32, 0.5, 0.78); // suave: solo un velo de luz
renderPipeline.outputNode = scenePassColor.add(bloomPass);

// ================= CONTROLES =================
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,2,0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false;
controls.autoRotate = !reducido; controls.autoRotateSpeed=0.55;
controls.minDistance=38; controls.maxDistance=150;
controls.maxPolarAngle=Math.PI*0.74; controls.minPolarAngle=Math.PI*0.16;
controls.enabled=false; // hasta que termine la apertura
controls.update();

// ================= INTERACCIÓN =================
const ray=new THREE.Raycaster(), raton=new THREE.Vector2();
const tarjeta=document.getElementById('tarjeta');
function mostrar(n){
  document.getElementById('t-nombre').textContent=n.userData.nombre;
  document.getElementById('t-desc').textContent=n.userData.desc||'';
  document.getElementById('t-nombre').style.color=n.userData.color;
  tarjeta.style.display = n.userData.desc ? 'block':'none';
  const mm=MAPA_NODO_MISION[n.userData.nombre];
  if(mm){ bVerMision.style.display='inline-block';
    bVerMision.onclick=()=>{ try{ parent.postMessage({type:'nassar-ver-mision',mision:mm},location.origin); }catch(e){} };
  } else bVerMision.style.display='none';
}
document.getElementById('cerrar').onclick=()=>tarjeta.style.display='none';
let px=0, py=0, movido=0;
canvas.addEventListener('pointerdown',e=>{ px=e.clientX; py=e.clientY; movido=0; if(!tween) controls.autoRotate=!reducido; });
canvas.addEventListener('pointermove',e=>{ movido+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0); });
canvas.addEventListener('pointerup',e=>{
  if(movido<8){
    raton.x=(e.clientX/innerWidth)*2-1; raton.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(raton,camera);
    const hit=ray.intersectObjects(nodosMalla)[0];
    if(hit) mostrar(hit.object); else { tarjeta.style.display='none'; limpiarFoco(); }
  }
});

// ================= ESTADOS DE MISIÓN (lo activo se ve) =================
function aplicarEstado(nodo, estado){
  const u=nodo.userData;
  if(estado==='activo' || estado==='en_curso'){
    u.state='hot';
    u.uAmp.value=0.22; u.uBright.value=1.6;
    u.halo.scale.set(u.baseHalo*1.5, u.baseHalo*1.5, 1);
    u.halo.material.opacity=0.6;
  } else if(estado==='pendiente'){
    u.state='dim';
    u.uAmp.value=0.05; u.uBright.value=0.7;
    u.halo.scale.set(u.baseHalo*0.75, u.baseHalo*0.75, 1);
    u.halo.material.opacity=0.25;
  } else {
    u.state='normal';
    u.uAmp.value=0.10; u.uBright.value = (u.nombre==="CEREBRO") ? 1.5 : 1.18;
    u.halo.scale.set(u.baseHalo, u.baseHalo, 1);
    u.halo.material.opacity=0.5;
  }
}

// ================= MENSAJES DESDE LA APP =================
addEventListener('message', e=>{
  if(!e.data) return;
  if(e.data.type==='nassar-descs' && e.data.descs){
    nodosMalla.forEach(m=>{
      const d=e.data.descs[m.userData.nombre];
      if(d) m.userData.desc=d;
    });
  }
  if(e.data.type==='nassar-misiones' && Array.isArray(e.data.misiones)){
    e.data.misiones.forEach(mi=>{
      const nn=MAPA_MISIONES[mi.nombre];
      if(!nn) return; // "App Nassar en vivo" no es nodo: se ignora
      const nodo=nodosPorNombre[nn];
      if(nodo) aplicarEstado(nodo, mi.estado);
    });
  }
});

// leyenda
document.getElementById('leyenda').innerHTML =
  `<div><span class="dot" style="background:${CENTRO.color};color:${CENTRO.color}"></span>Cerebro central</div>` +
  GRUPOS.map(g=>`<div><span class="dot" style="background:${g.color};color:${g.color}"></span>${g.nombre}</div>`).join('');

// ================= BUCLE =================
function resize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
let introT = reducido ? 1 : 0;
let primerFrame=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(), 0.05);
  const t=clock.elapsedTime;
  // apertura cinematográfica
  if(introT<1){
    introT=Math.min(1, introT+dt/3.4);
    const k=easeInOutCubic(introT);
    camera.position.lerpVectors(camStart, camEnd, k);
    camera.lookAt(0,2,0);
    if(introT>=1){ controls.enabled=true;
      if(focusPendiente){ const fp=focusPendiente; focusPendiente=null; enfocar(fp); } }
  } else if(!controls.enabled){ controls.enabled=true; }
  if(tween){
    tween.t+=dt/tween.dur;
    const k=easeInOutCubic(Math.min(1,tween.t));
    camera.position.lerpVectors(tween.fromP,tween.toP,k);
    controls.target.lerpVectors(tween.fromT,tween.toT,k);
    if(tween.t>=1) tween=null;
  }
  controls.update();
  // aparición escalonada de nodos
  for(const n of nodosMalla){
    const u=n.userData;
    const s=easeOutBack(clamp01((t-u.nacimiento)/0.6));
    const sc=Math.max(0.0001, s);
    n.scale.setScalar(sc);
    const foc=(n===focoNodo)?1.6:1;
    const hs=Math.max(0.0001, u.baseHalo*(u.state==='hot'?1.7:u.state==='dim'?0.75:1)*foc*s);
    u.halo.scale.set(hs,hs,1);
    if(u.etiqueta) u.etiqueta.material.opacity=clamp01((t-u.nacimiento-0.25)/0.5);
    if(u.etiqueta2) u.etiqueta2.material.opacity=clamp01((t-u.nacimiento-0.25)/0.5);
  }
  // vida ambiental

  for(let i=0;i<NP;i++){
    pT[i]+=dt*0.22;
    if(pT[i]>1){ pT[i]=0; pEdge[i]=(Math.random()*aristas.length)|0; }
    const e=aristas[pEdge[i]], k=pT[i];
    pPos[i*3]  =e.a.x+(e.b.x-e.a.x)*k;
    pPos[i*3+1]=e.a.y+(e.b.y-e.a.y)*k;
    pPos[i*3+2]=e.a.z+(e.b.z-e.a.z)*k;
  }
  pGeo.attributes.position.needsUpdate=true;
  renderPipeline.render();
  if(primerFrame){ primerFrame=false;
    setTimeout(()=>{ document.getElementById('intro').style.opacity='0'; }, 350); }
});

// ================= FOCO PANEL <-> CEREBRO =================
const MAPA_NODO_MISION={};
for(const k in MAPA_MISIONES) MAPA_NODO_MISION[MAPA_MISIONES[k]]=k;
const bVerMision=document.getElementById('b-ver-mision');
let focoNodo=null, tween=null, focusPendiente=null;

function limpiarFoco(){
  const n=focoNodo; focoNodo=null;
  if(!n||!n.userData._snap) return;
  const s=n.userData._snap, u=n.userData;
  u.uAmp.value=s.amp; u.uBright.value=s.bright; u.halo.material.opacity=s.hop;
}
function enfocar(nombreMision){
  const nn=MAPA_MISIONES[nombreMision]||(nodosPorNombre[nombreMision]?nombreMision:null);
  const n=nn?nodosPorNombre[nn]:null;
  if(!n) return;
  if(introT<1){ focusPendiente=nombreMision; return; }
  limpiarFoco();
  const u=n.userData;
  u._snap={amp:u.uAmp.value, bright:u.uBright.value, hop:u.halo.material.opacity};
  u.uAmp.value=0.28; u.uBright.value=1.8; u.halo.material.opacity=0.7;
  focoNodo=n;
  mostrar(n);
  const dir=camera.position.clone().sub(controls.target).normalize();
  tween={t:0,dur:1.15,
    fromP:camera.position.clone(), toP:n.position.clone().add(dir.multiplyScalar(42)),
    fromT:controls.target.clone(), toT:n.position.clone()};
  controls.autoRotate=false;
}
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data) return;
  if(e.data.type==='nassar-focus') enfocar(e.data.mision);
});
if(window.__nassarQ&&window.__nassarQ.length){
  window.__nassarQ.splice(0).forEach(d=>{ try{enfocar(d.mision);}catch(e){} });
}
</script>
