const $=id=>document.getElementById(id);
let fails=0,lockedUntil=0;
function b64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(){
 const now=Date.now();
 if(now<lockedUntil){$('err').textContent='Espera unos segundos e inténtalo de nuevo.';return;}
 const pw=$('pw').value;if(!pw)return;
 $('go').disabled=true;$('err').textContent='Abriendo…';
 try{
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENV.salt),iterations:ENV.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENV.iv)},key,b64(ENV.data));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
 }catch(e){
  fails++;
  if(fails>=5){lockedUntil=Date.now()+30000;fails=0;$('err').textContent='Demasiados intentos. Espera 30 segundos.';}
  else $('err').textContent='Contraseña incorrecta.';
  $('go').disabled=false;
 }
}
$('go').onclick=unlock;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
