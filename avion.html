/* ===== utilidades ===== */
const clamp01=t=>Math.max(0,Math.min(1,t));
const easeOutBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,255,255,.5)');
  g.addColorStop(0.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
const GLOW=glowTex();
function etiqueta(texto,fs){
  const c=document.createElement('canvas');
  let x=c.getContext('2d');
  x.font='600 '+fs+'px "Kode Mono",monospace';
  try{x.letterSpacing='2px';}catch(e){}
  const tw=x.measureText(texto).width,pad=13;
  c.width=Math.ceil(tw+pad*2);c.height=fs+20;
  x=c.getContext('2d');
  x.fillStyle='rgba(11,12,16,0.78)';
  x.strokeStyle='rgba(236,234,227,0.16)';x.lineWidth=2;
  x.beginPath();
  const r=c.height/2;
  if(x.roundRect) x.roundRect(2,2,c.width-4,c.height-4,r-2); else x.rect(2,2,c.width-4,c.height-4);
  x.fill();x.stroke();
  x.font='600 '+fs+'px "Kode Mono",monospace';
  try{x.letterSpacing='2px';}catch(e){}
  x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=5;
  x.fillStyle='#ECEAE3';
  x.fillText(texto,pad,c.height/2+1);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));
  const k=0.035;
  s.scale.set(c.width*k,c.height*k,1);s.renderOrder=5;
  return s;
}
function nodo3d(hex,radio,esCentro){
  const base=new THREE.Color(hex);
  const mat=new THREE.MeshBasicMaterial({color:base.clone().multiplyScalar(esCentro?1.0:0.92)});
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,20),mat);
  m.scale.setScalar(radio);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:hex,transparent:true,
    opacity:0.24,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
  const hs=radio*(esCentro?9:8);
  halo.scale.set(hs,hs,1); halo.renderOrder=4;
  return {m,mat,halo,base,hs};
}

/* ================= MOTOR: vista avión (todo desplegado) ================= */
const PADRE={};
for(const id in NODOS) for(const h of NODOS[id].hijos) PADRE[h]=id;
const PROF={};
for(const id of Object.keys(NODOS)) PROF[id]=id==='cerebro'?0:PROF[PADRE[id]]+1;
const POSA={};
POSA['cerebro']=new THREE.Vector3(0,0,0);
NODOS['cerebro'].hijos.forEach((s,i)=>{ const a=(i/NODOS['cerebro'].hijos.length)*Math.PI*2-Math.PI/2;
  POSA[s]=new THREE.Vector3(Math.cos(a)*34,0,Math.sin(a)*34); });
const RADIO_NIVEL={2:11.5,3:5.8};
for(const id of Object.keys(NODOS)){
  const p=PROF[id];
  if(p>=2){ const par=PADRE[id], sib=NODOS[par].hijos, j=sib.indexOf(id);
    const rr=RADIO_NIVEL[p]||3.4;
    const a=(j/sib.length)*Math.PI*2+p*0.5;
    POSA[id]=POSA[par].clone().add(new THREE.Vector3(Math.cos(a)*rr,0,Math.sin(a)*rr)); }
}
const RAD=[3.4,2.0,1.05,0.72,0.55];

const mallas={}, orden=Object.keys(NODOS);
for(const id of orden){
  const n=NODOS[id], prof=PROF[id], esC=id==='cerebro', r=RAD[Math.min(prof,4)];
  const nd=nodo3d(n.color,r,esC);
  const m=nd.m;
  m.position.copy(POSA[id]||new THREE.Vector3());
  const lab=etiqueta(n.label,esC?34:26);
  lab.position.set(m.position.x,m.position.y+r+1.8,m.position.z);
  lab.material.opacity=0;
  scene.add(lab);
  nd.halo.position.copy(m.position);
  scene.add(nd.halo);
  const u={id,nombre:n.nombre,mat:nd.mat,base:nd.base,halo:nd.halo,etiqueta:lab,r,
    fase:Math.random()*6.28,hop:0.22,delay:Math.random()*1.2};
  m.userData=u; scene.add(m); mallas[id]=m;
}
/* aristas */
const aristas=[];
for(const id of orden) if(id!=='cerebro') aristas.push([PADRE[id],id]);
{
  const lp=new Float32Array(aristas.length*6), lc=new Float32Array(aristas.length*6);
  aristas.forEach((e,i)=>{
    const pa=POSA[e[0]]||new THREE.Vector3(), pb=POSA[e[1]]||new THREE.Vector3(), c=hexRgb(NODOS[e[1]].color);
    lp[i*6]=pa.x;lp[i*6+1]=pa.y;lp[i*6+2]=pa.z;lp[i*6+3]=pb.x;lp[i*6+4]=pb.y;lp[i*6+5]=pb.z;
    for(let k=0;k<2;k++){ lc[i*6+k*3]=c[0]*0.4;lc[i*6+k*3+1]=c[1]*0.4;lc[i*6+k*3+2]=c[2]*0.4; }
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(lp,3));
  g.setAttribute('color',new THREE.BufferAttribute(lc,3));
  const lineas=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.25}));
  lineas.frustumCulled=false; scene.add(lineas);
}
/* partículas */
const NP=80;
const pPos=new Float32Array(NP*3), pT=new Float32Array(NP), pEdge=new Uint16Array(NP);
for(let i=0;i<NP;i++){ pEdge[i]=(Math.random()*aristas.length)|0; pT[i]=Math.random(); }
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const puntos=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffe6b3,size:0.9,transparent:true,
  opacity:0.7,depthWrite:false,blending:THREE.AdditiveBlending}));
puntos.frustumCulled=false; scene.add(puntos);

/* controles */
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false;
controls.autoRotate=false;
controls.minDistance=40; controls.maxDistance=520;
controls.maxPolarAngle=Math.PI; controls.minPolarAngle=0;
controls.update();
const cvs=renderer.domElement;


/* interacción */
const ray=new THREE.Raycaster(), raton=new THREE.Vector2();
const detalleEl=document.getElementById('detalle');
let movido=0;
function pick(e){
  raton.x=(e.clientX/innerWidth)*2-1; raton.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(raton,camera);
  const hit=ray.intersectObjects(orden.map(id=>mallas[id]),false)[0];
  return hit?hit.object.userData.id:null;
}
function mostrarDetalle(id){
  const n=NODOS[id];
  document.getElementById('d-nombre').innerHTML='<span class="dot" style="background:'+n.color+'"></span>'+n.nombre;
  document.getElementById('d-desc').textContent=n.desc||'';
  document.getElementById('d-meta').textContent=(n.hijos.length?n.hijos.length+' SUBNODOS':'NODO FINAL');
  detalleEl.classList.remove('vis'); void detalleEl.offsetWidth; detalleEl.classList.add('vis');
}
document.getElementById('d-cerrar').onclick=()=>detalleEl.classList.remove('vis');
cvs.addEventListener('pointermove',e=>{ movido+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0); });
cvs.addEventListener('pointerdown',()=>{ movido=0; });
cvs.addEventListener('pointerup',e=>{
  if(movido<8){ const id=pick(e); if(id) mostrarDetalle(id); else detalleEl.classList.remove('vis'); }
});
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data) return;
  if(e.data.type==='nassar-descs'&&e.data.descs){
    for(const id in mallas){ const t=e.data.descs[mallas[id].userData.nombre];
      if(t) NODOS[id].desc=t; }
  }
});
if(window.__nassarQ&&window.__nassarQ.length) window.__nassarQ.splice(0).forEach(()=>{});

/* bucle */
function resize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
const camStart=new THREE.Vector3(0,220,460);
const camEnd=new THREE.Vector3(0,130,280);
camera.position.copy(camStart);
let introT=0, primerFrame=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(introT<1){
    introT=Math.min(1,introT+dt/3.2);
    const k=easeInOutCubic(introT);
    camera.position.lerpVectors(camStart,camEnd,k);
    camera.lookAt(0,0,0);
  }
  controls.update();
  for(const id of orden){
    const m=mallas[id], u=m.userData;
    const s=easeOutBack(clamp01((t-u.delay)/0.6));
    m.scale.setScalar(Math.max(0.0001,u.r*s));
    m.position.set(POSA[id].x+Math.sin(t*0.7+u.fase)*0.3,POSA[id].y,POSA[id].z+Math.cos(t*0.55+u.fase)*0.3);
    u.halo.material.opacity=u.hop+Math.sin(t*1.3+u.fase)*0.04;
    u.halo.position.copy(m.position);
    u.etiqueta.position.set(m.position.x,m.position.y+u.r+1.6,m.position.z);
    u.etiqueta.material.opacity=clamp01((t-u.delay-0.3)/0.5);
  }
  for(let i=0;i<NP;i++){
    pT[i]+=dt*0.18;
    if(pT[i]>1){ pT[i]=0; pEdge[i]=(Math.random()*aristas.length)|0; }
    const e=aristas[pEdge[i]], k=pT[i];
    const pa=mallas[e[0]].position, pb=mallas[e[1]].position;
    pPos[i*3]=pa.x+(pb.x-pa.x)*k; pPos[i*3+1]=pa.y+(pb.y-pa.y)*k; pPos[i*3+2]=pa.z+(pb.z-pa.z)*k;
  }
  pGeo.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
  if(primerFrame){ primerFrame=false;
    setTimeout(()=>{ document.getElementById('intro').style.opacity='0'; },400); }
});

__ok=true;
</script>
