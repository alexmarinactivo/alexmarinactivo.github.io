<!DOCTYPE html>
<!-- OFICINA v7 GOLDEN 2026-10-15 -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFICINA - 3D Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfafafa);
        let currentParent = scene; // los constructores añaden aquí

        // Camera - Isometric style
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0);

        // Materials
        const materials = {
            whiteFloor: new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.15, 
                metalness: 0.05 
            }),
            whitePlastic: new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.3, 
                metalness: 0.0 
            }),
            glass: new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff,
                transparent: true,
                opacity: 0.12,
                roughness: 0.05,
                metalness: 0.1,
                transmission: 0.85,
                reflectivity: 0.3,
                envMapIntensity: 0.5
            }),
            whiteFrame: new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.3, 
                metalness: 0.1 
            }),
            metalChrome: new THREE.MeshStandardMaterial({ 
                color: 0xcccccc, 
                roughness: 0.1, 
                metalness: 0.95 
            }),
            screenBlue: new THREE.MeshStandardMaterial({ 
                color: 0x00aaff,
                emissive: 0x00aaff,
                emissiveIntensity: 1.2,
                roughness: 0.1
            }),
            keyboard: new THREE.MeshStandardMaterial({ 
                color: 0x2a2a2a, 
                roughness: 0.6, 
                metalness: 0.1 
            }),
            chairFabric: new THREE.MeshStandardMaterial({ 
                color: 0x333333, 
                roughness: 0.8, 
                metalness: 0.0 
            }),
            plantGreen: new THREE.MeshStandardMaterial({ 
                color: 0x4a7c59, 
                roughness: 0.7, 
                metalness: 0.0 
            }),
            plantGreenLight: new THREE.MeshStandardMaterial({ 
                color: 0x6b9b5c, 
                roughness: 0.7, 
                metalness: 0.0 
            }),
            potWhite: new THREE.MeshStandardMaterial({ 
                color: 0xf0f0f0, 
                roughness: 0.4, 
                metalness: 0.0 
            }),
            carpet: new THREE.MeshStandardMaterial({ 
                color: 0xc8c8c8, 
                roughness: 0.95, 
                metalness: 0.0 
            }),
            paper: new THREE.MeshStandardMaterial({ 
                color: 0xfafafa, 
                roughness: 0.9, 
                metalness: 0.0 
            }),
            mug: new THREE.MeshStandardMaterial({ 
                color: 0xf5f5f5, 
                roughness: 0.3, 
                metalness: 0.0 
            }),
            bookRed: new THREE.MeshStandardMaterial({ color: 0xc94c4c, roughness: 0.7 }),
            bookBlue: new THREE.MeshStandardMaterial({ color: 0x4c7cc9, roughness: 0.7 }),
            bookGreen: new THREE.MeshStandardMaterial({ color: 0x4cc978, roughness: 0.7 }),
            bookYellow: new THREE.MeshStandardMaterial({ color: 0xc9b84c, roughness: 0.7 }),
            bookPurple: new THREE.MeshStandardMaterial({ color: 0x8b4cc9, roughness: 0.7 }),
            whiteboard: new THREE.MeshStandardMaterial({ color: 0xfcfcfc, roughness: 0.3 }),
            markerRed: new THREE.MeshBasicMaterial({ color: 0xe74c3c }),
            markerBlue: new THREE.MeshBasicMaterial({ color: 0x3498db }),
            markerGreen: new THREE.MeshBasicMaterial({ color: 0x27ae60 })
        };

        // Skin tones
        const skinTones = [0xffdbac, 0xf5c6a5, 0xe8beac, 0xd4a574, 0xc68642];
        const shirtColors = [0x4a90d9, 0x6b7b8c, 0xffffff, 0x3c5a7d, 0x8fa4b8, 0x2c3e50];
        const hairColors = [0x1a1a1a, 0x3d2314, 0x4a3728, 0x2c1810, 0x5a4a3a, 0x0a0a0a];

        // Floor parametrizado
        function createFloor(w, d) {
            const floor = new THREE.Mesh(
                new THREE.BoxGeometry(w, 0.1, d),
                materials.whiteFloor
            );
            floor.position.y = -0.05;
            floor.receiveShadow = true;
            currentParent.add(floor);
        }

        // Glass walls with frames (parametrizado w,d)
        function createWalls(w, d) {
            const wallGroup = new THREE.Group();
            const hw = w / 2, hd = d / 2, H = 3;
            const wallConfigs = [
                { pos: [0, H/2, -hd], size: [w, H, 0.02] },
                { pos: [0, H/2, hd], size: [w, H, 0.02] },
                { pos: [-hw, H/2, 0], rot: Math.PI/2, size: [d, H, 0.02] },
                { pos: [hw, H/2, 0], rot: Math.PI/2, size: [d, H, 0.02] }
            ];
            wallConfigs.forEach(config => {
                const glass = new THREE.Mesh(
                    new THREE.BoxGeometry(...config.size),
                    materials.glass
                );
                glass.position.set(...config.pos);
                if (config.rot) glass.rotation.y = config.rot;
                wallGroup.add(glass);
            });
            function cf(x, y, z, ww, hh, dd) {
                const frame = new THREE.Mesh(new THREE.BoxGeometry(ww, hh, dd), materials.whiteFrame);
                frame.position.set(x, y, z);
                frame.castShadow = true;
                wallGroup.add(frame);
            }
            // Marcos: 3 verticales + 2 horizontales por pared
            [-hd, hd].forEach(z => {
                cf(-hw, H/2, z, 0.05, H, 0.05); cf(hw, H/2, z, 0.05, H, 0.05); cf(0, H/2, z, 0.05, H, 0.05);
                cf(0, 0.02, z, w, 0.05, 0.05); cf(0, H, z, w, 0.05, 0.05);
            });
            [-hw, hw].forEach(x => {
                cf(x, H/2, -hd, 0.05, H, 0.05); cf(x, H/2, hd, 0.05, H, 0.05); cf(x, H/2, 0, 0.05, H, 0.05);
                cf(x, 0.02, 0, 0.05, 0.05, d); cf(x, H, 0, 0.05, 0.05, d);
            });
            currentParent.add(wallGroup);
        }

        // Carpet parametrizada
        function createCarpet(w, d) {
            const carpet = new THREE.Mesh(
                new THREE.BoxGeometry(w, 0.02, d),
                materials.carpet
            );
            carpet.position.set(0, 0.01, 0);
            carpet.receiveShadow = true;
            currentParent.add(carpet);
        }

        // Desk - 25% bigger
        function createDesk(x, z) {
            const deskGroup = new THREE.Group();
            
            // Desktop - 25% bigger
            const desktop = new THREE.Mesh(
                new THREE.BoxGeometry(2.0, 0.05, 1.0),
                materials.whitePlastic
            );
            desktop.position.set(0, 0.74, 0);
            desktop.castShadow = true;
            desktop.receiveShadow = true;
            deskGroup.add(desktop);

            // Legs
            const legGeom = new THREE.CylinderGeometry(0.03, 0.03, 0.72, 8);
            const legPositions = [
                [-0.9, 0.36, -0.4],
                [-0.9, 0.36, 0.4],
                [0.9, 0.36, -0.4],
                [0.9, 0.36, 0.4]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeom, materials.metalChrome);
                leg.position.set(...pos);
                leg.castShadow = true;
                deskGroup.add(leg);
            });

            // Cross support
            const support = new THREE.Mesh(
                new THREE.BoxGeometry(1.7, 0.02, 0.02),
                materials.metalChrome
            );
            support.position.set(0, 0.15, 0);
            deskGroup.add(support);

            deskGroup.position.set(x, 0, z);
            currentParent.add(deskGroup);
            return deskGroup;
        }

        // Monitor
        function createMonitor(x, z, rotation = 0) {
            const monitorGroup = new THREE.Group();
            
            // Screen frame
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.4, 0.025),
                materials.keyboard
            );
            frame.position.set(0, 0.98, 0);
            frame.castShadow = true;
            monitorGroup.add(frame);

            // Screen - brighter blue
            const screen = new THREE.Mesh(
                new THREE.BoxGeometry(0.55, 0.35, 0.01),
                materials.screenBlue
            );
            screen.position.set(0, 0.98, 0.018);
            monitorGroup.add(screen);

            // Stand neck
            const neck = new THREE.Mesh(
                new THREE.BoxGeometry(0.04, 0.14, 0.04),
                materials.metalChrome
            );
            neck.position.set(0, 0.82, -0.02);
            neck.castShadow = true;
            monitorGroup.add(neck);

            // Stand base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.14, 0.02, 16),
                materials.metalChrome
            );
            base.position.set(0, 0.77, -0.02);
            base.castShadow = true;
            monitorGroup.add(base);

            monitorGroup.position.set(x, 0, z);
            monitorGroup.rotation.y = rotation;
            currentParent.add(monitorGroup);
            return monitorGroup;
        }

        // Keyboard
        function createKeyboard(x, z, rotation = 0) {
            const keyboardGroup = new THREE.Group();
            
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(0.45, 0.015, 0.16),
                materials.keyboard
            );
            base.position.set(0, 0.77, 0);
            base.castShadow = true;
            keyboardGroup.add(base);

            // Keys indication (4 tiras optimizadas)
            const keyMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.5 });
            for (let i = 0; i < 4; i++) {
                const strip = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.008, 0.028),
                    keyMat
                );
                strip.position.set(0, 0.785, -0.05 + i * 0.035);
                keyboardGroup.add(strip);
            }

            keyboardGroup.position.set(x, 0, z);
            keyboardGroup.rotation.y = rotation;
            currentParent.add(keyboardGroup);
            return keyboardGroup;
        }

        // Chair
        function createChair(x, z, rotation = 0) {
            const chairGroup = new THREE.Group();
            
            // Seat
            const seat = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.06, 0.5),
                materials.chairFabric
            );
            seat.position.set(0, 0.45, 0);
            seat.castShadow = true;
            chairGroup.add(seat);

            // Backrest
            const backrest = new THREE.Mesh(
                new THREE.BoxGeometry(0.46, 0.55, 0.05),
                materials.chairFabric
            );
            backrest.position.set(0, 0.76, -0.22);
            backrest.rotation.x = 0.1;
            backrest.castShadow = true;
            chairGroup.add(backrest);

            // Center pole
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.03, 0.25, 8),
                materials.metalChrome
            );
            pole.position.set(0, 0.3, 0);
            pole.castShadow = true;
            chairGroup.add(pole);

            // Base star
            for (let i = 0; i < 5; i++) {
                const arm = new THREE.Mesh(
                    new THREE.BoxGeometry(0.04, 0.03, 0.25),
                    materials.metalChrome
                );
                arm.position.set(0, 0.08, 0.1);
                arm.rotation.y = (i * Math.PI * 2) / 5;
                arm.position.x = Math.sin((i * Math.PI * 2) / 5) * 0.1;
                arm.position.z = Math.cos((i * Math.PI * 2) / 5) * 0.1;
                chairGroup.add(arm);

                // Wheel
                const wheel = new THREE.Mesh(
                    new THREE.SphereGeometry(0.035, 8, 8),
                    materials.keyboard
                );
                wheel.position.set(
                    Math.sin((i * Math.PI * 2) / 5) * 0.22,
                    0.035,
                    Math.cos((i * Math.PI * 2) / 5) * 0.22
                );
                chairGroup.add(wheel);
            }

            // Gas cylinder
            const cylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(0.035, 0.04, 0.1, 8),
                materials.keyboard
            );
            cylinder.position.set(0, 0.13, 0);
            chairGroup.add(cylinder);

            // Armrests
            const armrestGeom = new THREE.BoxGeometry(0.04, 0.04, 0.25);
            const armLeft = new THREE.Mesh(armrestGeom, materials.keyboard);
            armLeft.position.set(-0.27, 0.58, 0.05);
            chairGroup.add(armLeft);

            const armRight = new THREE.Mesh(armrestGeom, materials.keyboard);
            armRight.position.set(0.27, 0.58, 0.05);
            chairGroup.add(armRight);

            // Armrest supports
            const supportGeom = new THREE.BoxGeometry(0.03, 0.15, 0.03);
            const supportLeft = new THREE.Mesh(supportGeom, materials.keyboard);
            supportLeft.position.set(-0.27, 0.52, -0.05);
            chairGroup.add(supportLeft);

            const supportRight = new THREE.Mesh(supportGeom, materials.keyboard);
            supportRight.position.set(0.27, 0.52, -0.05);
            chairGroup.add(supportRight);

            chairGroup.position.set(x, 0, z);
            chairGroup.rotation.y = rotation;
            currentParent.add(chairGroup);
            return chairGroup;
        }

        // Small plant
        function createSmallPlant(x, y, z) {
            const plantGroup = new THREE.Group();
            
            // Pot
            const pot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.04, 0.035, 0.06, 12),
                materials.potWhite
            );
            pot.position.set(0, 0.03, 0);
            pot.castShadow = true;
            plantGroup.add(pot);

            // Soil
            const soil = new THREE.Mesh(
                new THREE.CylinderGeometry(0.035, 0.035, 0.01, 12),
                new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 })
            );
            soil.position.set(0, 0.055, 0);
            plantGroup.add(soil);

            // Leaves
            const leafMaterials = [materials.plantGreen, materials.plantGreenLight];
            for (let i = 0; i < 6; i++) {
                const leaf = new THREE.Mesh(
                    new THREE.ConeGeometry(0.02, 0.08, 4),
                    leafMaterials[i % 2]
                );
                const angle = (i * Math.PI * 2) / 6;
                leaf.position.set(
                    Math.sin(angle) * 0.02,
                    0.1,
                    Math.cos(angle) * 0.02
                );
                leaf.rotation.x = -0.3;
                leaf.rotation.y = angle;
                leaf.castShadow = true;
                plantGroup.add(leaf);
            }

            // Center leaf
            const centerLeaf = new THREE.Mesh(
                new THREE.ConeGeometry(0.025, 0.1, 4),
                materials.plantGreen
            );
            centerLeaf.position.set(0, 0.12, 0);
            centerLeaf.castShadow = true;
            plantGroup.add(centerLeaf);

            plantGroup.position.set(x, y, z);
            currentParent.add(plantGroup);
            return plantGroup;
        }

        // Large plant
        function createLargePlant(x, z) {
            const plantGroup = new THREE.Group();
            
            // Pot
            const pot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.15, 0.35, 16),
                materials.potWhite
            );
            pot.position.set(0, 0.175, 0);
            pot.castShadow = true;
            pot.receiveShadow = true;
            plantGroup.add(pot);

            // Soil
            const soil = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18, 0.18, 0.03, 16),
                new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 })
            );
            soil.position.set(0, 0.34, 0);
            plantGroup.add(soil);

            // Main stem
            const stem = new THREE.Mesh(
                new THREE.CylinderGeometry(0.02, 0.03, 0.6, 8),
                new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.8 })
            );
            stem.position.set(0, 0.65, 0);
            stem.castShadow = true;
            plantGroup.add(stem);

            // Large leaves
            for (let i = 0; i < 8; i++) {
                const leaf = new THREE.Mesh(
                    new THREE.ConeGeometry(0.08, 0.35, 6),
                    i % 2 === 0 ? materials.plantGreen : materials.plantGreenLight
                );
                const angle = (i * Math.PI * 2) / 8;
                const height = 0.6 + (i % 3) * 0.15;
                leaf.position.set(
                    Math.sin(angle) * 0.12,
                    height,
                    Math.cos(angle) * 0.12
                );
                leaf.rotation.x = -0.5 - Math.random() * 0.3;
                leaf.rotation.y = angle;
                leaf.rotation.z = Math.random() * 0.2 - 0.1;
                leaf.castShadow = true;
                plantGroup.add(leaf);
            }

            // Top leaves
            for (let i = 0; i < 5; i++) {
                const leaf = new THREE.Mesh(
                    new THREE.ConeGeometry(0.06, 0.25, 6),
                    materials.plantGreen
                );
                const angle = (i * Math.PI * 2) / 5;
                leaf.position.set(
                    Math.sin(angle) * 0.05,
                    1.0,
                    Math.cos(angle) * 0.05
                );
                leaf.rotation.x = -0.2;
                leaf.rotation.y = angle;
                leaf.castShadow = true;
                plantGroup.add(leaf);
            }

            plantGroup.position.set(x, 0, z);
            currentParent.add(plantGroup);
            return plantGroup;
        }

        // Cabinet/Drawer
        function createCabinet(x, z, rotation = 0) {
            const cabinetGroup = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.45, 0.65, 0.55),
                materials.whitePlastic
            );
            body.position.set(0, 0.325, 0);
            body.castShadow = true;
            body.receiveShadow = true;
            cabinetGroup.add(body);

            // Drawers
            for (let i = 0; i < 3; i++) {
                const drawer = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.18, 0.02),
                    new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.4 })
                );
                drawer.position.set(0, 0.12 + i * 0.2, 0.28);
                cabinetGroup.add(drawer);

                // Handle
                const handle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.015, 0.02),
                    materials.metalChrome
                );
                handle.position.set(0, 0.12 + i * 0.2, 0.3);
                cabinetGroup.add(handle);
            }

            cabinetGroup.position.set(x, 0, z);
            cabinetGroup.rotation.y = rotation;
            currentParent.add(cabinetGroup);
            return cabinetGroup;
        }

        // File cabinet (archivador)
        function createFileCabinet(x, z, rotation = 0) {
            const cabinetGroup = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 1.2, 0.5),
                materials.whitePlastic
            );
            body.position.set(0, 0.6, 0);
            body.castShadow = true;
            body.receiveShadow = true;
            cabinetGroup.add(body);

            // Drawers
            for (let i = 0; i < 4; i++) {
                const drawer = new THREE.Mesh(
                    new THREE.BoxGeometry(0.45, 0.25, 0.02),
                    new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.4 })
                );
                drawer.position.set(0, 0.15 + i * 0.28, 0.26);
                cabinetGroup.add(drawer);

                // Handle
                const handle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, 0.02, 0.02),
                    materials.metalChrome
                );
                handle.position.set(0, 0.15 + i * 0.28, 0.28);
                cabinetGroup.add(handle);
            }

            cabinetGroup.position.set(x, 0, z);
            cabinetGroup.rotation.y = rotation;
            currentParent.add(cabinetGroup);
            return cabinetGroup;
        }

        // Mug
        function createMug(x, y, z) {
            const mugGroup = new THREE.Group();
            
            const cup = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.025, 0.07, 12),
                materials.mug
            );
            cup.castShadow = true;
            mugGroup.add(cup);

            // Handle
            const handleCurve = new THREE.TorusGeometry(0.02, 0.005, 8, 12, Math.PI);
            const handle = new THREE.Mesh(handleCurve, materials.mug);
            handle.rotation.y = Math.PI / 2;
            handle.rotation.z = Math.PI / 2;
            handle.position.set(0.035, 0, 0);
            mugGroup.add(handle);

            // Coffee
            const coffee = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 0.01, 12),
                new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.3 })
            );
            coffee.position.y = 0.025;
            mugGroup.add(coffee);

            mugGroup.position.set(x, y, z);
            currentParent.add(mugGroup);
            return mugGroup;
        }

        // Papers
        function createPapers(x, y, z, rotation = 0) {
            const papersGroup = new THREE.Group();
            
            for (let i = 0; i < 4; i++) {
                const paper = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 0.002, 0.2),
                    materials.paper
                );
                paper.position.set(
                    (Math.random() - 0.5) * 0.02,
                    i * 0.003,
                    (Math.random() - 0.5) * 0.02
                );
                paper.rotation.y = (Math.random() - 0.5) * 0.2;
                paper.castShadow = true;
                papersGroup.add(paper);
            }

            papersGroup.position.set(x, y, z);
            papersGroup.rotation.y = rotation;
            currentParent.add(papersGroup);
            return papersGroup;
        }

        // Desk lamp
        function createDeskLamp(x, y, z) {
            const lampGroup = new THREE.Group();
            
            // Base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.07, 0.02, 16),
                materials.whitePlastic
            );
            base.castShadow = true;
            lampGroup.add(base);

            // Arm 1
            const arm1 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.008, 0.008, 0.2, 8),
                materials.metalChrome
            );
            arm1.position.set(0, 0.1, 0);
            arm1.rotation.z = 0.3;
            arm1.castShadow = true;
            lampGroup.add(arm1);

            // Joint
            const joint = new THREE.Mesh(
                new THREE.SphereGeometry(0.015, 8, 8),
                materials.metalChrome
            );
            joint.position.set(0.06, 0.19, 0);
            lampGroup.add(joint);

            // Arm 2
            const arm2 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.008, 0.008, 0.18, 8),
                materials.metalChrome
            );
            arm2.position.set(0.12, 0.27, 0);
            arm2.rotation.z = -0.4;
            arm2.castShadow = true;
            lampGroup.add(arm2);

            // Shade
            const shade = new THREE.Mesh(
                new THREE.ConeGeometry(0.06, 0.08, 16, 1, true),
                materials.whitePlastic
            );
            shade.position.set(0.16, 0.32, 0);

        // Label sprite
        function createLabel(text, x, y, z) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            
            // Background pill
            context.fillStyle = 'rgba(30, 30, 30, 0.95)';
            const radius = 40;
            const padding = 30;
            const textWidth = 300;
            const pillWidth = textWidth + padding * 2;
            const pillHeight = 80;
            const startX = (canvas.width - pillWidth) / 2;
            const startY = (canvas.height - pillHeight) / 2;
            
            context.beginPath();
            context.moveTo(startX + radius, startY);
            context.lineTo(startX + pillWidth - radius, startY);
            context.quadraticCurveTo(startX + pillWidth, startY, startX + pillWidth, startY + radius);
            context.lineTo(startX + pillWidth, startY + pillHeight - radius);
            context.quadraticCurveTo(startX + pillWidth, startY + pillHeight, startX + pillWidth - radius, startY + pillHeight);
            context.lineTo(startX + radius, startY + pillHeight);
            context.quadraticCurveTo(startX, startY + pillHeight, startX, startY + pillHeight - radius);
            context.lineTo(startX, startY + radius);
            context.quadraticCurveTo(startX, startY, startX + radius, startY);
            context.closePath();
            context.fill();
            
            // Text
            context.fillStyle = '#ffffff';
            context.font = 'bold 42px Arial, sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            
            const material = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true,
                depthTest: false
            });
            
            const sprite = new THREE.Sprite(material);
            sprite.position.set(x, y, z);
            sprite.scale.set(2.5, 0.625, 1);
            scene.add(sprite);
            return sprite;
        }

        function layoutDesks(w, d, n) {
            // 2 filas; devuelve lista de {x, z, rot}
            const spots = [];
            const perRow = Math.ceil(n / 2);
            const xs = [];
            for (let i = 0; i < perRow; i++) xs.push(-w/2 + 2.2 + i * ((w - 4.4) / Math.max(1, perRow - 1)));
            const rows = n > 1 ? 2 : 1;
            for (let r = 0; r < rows && spots.length < n; r++) {
                const z = r === 0 ? -d/4 : d/4;
                const rot = r === 0 ? 0 : Math.PI;
                for (const x of xs) {
                    if (spots.length >= n) break;
                    spots.push({ x, z, rot });
                }
            }
            return spots;
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(roomGroups, true);
            if (hits.length) {
                let o = hits[0].object;
                while (o && !o.userData.roomName) o = o.parent;
                if (o) {
                    const wp = new THREE.Vector3(); o.getWorldPosition(wp);
                    focusRoom(o.userData.roomName, o.userData.agentCount, wp.x, wp.z);
                    return;
                }
            }
            resetView();
        });

        // Cámara general
        camera.position.set(34, 28, 40);
        camera.lookAt(0, 1, 6);
        controls.target.set(0, 1, 6);
        // Ampliar sombras para toda la oficina
        buildAllRooms();
        controls.update();

        function animate() {
            requestAnimationFrame(animate);
            if (camGoal) {
                camera.position.lerp(camGoal, 0.06);
                controls.target.lerp(tgtGoal, 0.08);
                if (camera.position.distanceTo(camGoal) < 0.15) camGoal = null;
            }
            holograms.forEach((h, i) => { h.rotation.y += 0.004 + i * 0.001; });
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
